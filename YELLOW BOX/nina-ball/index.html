<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bellies · karaoke ball</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* karaoke: Cecilia's calligraphy is the words; a woman cut out of an 1870s painting is the bouncing ball */
html,body{height:100%}
body{background:#000;margin:0;overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
</style>
<canvas id="stage" role="button" tabindex="0" aria-label="Lyrics of Bellies by Nina Nastasia in Cecilia's calligraphy, with a woman from an 1870s painting bouncing on each word. Click to start the song."></canvas>
<script>
(function(){
'use strict';
const DURATION=234.26;

/* ---------- the women: cut out of paintings c. 1866–1882 (Wikimedia Commons, public domain) ---------- */
// Manet: Bar aux Folies-Bergère, Berthe Morisot (violettes, éventail), Chemin de fer, Le Repos, Jeune dame en 1866, Nana, Le Balcon;
// Renoir: La Loge; Degas: L'Absinthe; Morisot: Le Berceau
const KEYS=['bar','violets','railway','loge','absinthe','repos','lady','nana','cradle','balcony','fan'];
const WOMEN={};KEYS.forEach(k=>{const im=new Image();im.src='women/'+k+'.webp';WOMEN[k]=im;});

/* ---------- the words of each line: gaps in the ink between words, found once ---------- */
function words(c){
  const W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,col=new Uint8Array(W);
  for(let x=0;x<W;x++){for(let y=0;y<H;y+=2)if(d[(y*W+x)*4+3]>40){col[x]=1;break;}}
  const gap=Math.max(6,H*.14),segs=[];let s=-1,last=-1e9;
  for(let x=0;x<W;x++){if(!col[x])continue;if(s<0)s=x;else if(x-last>gap){segs.push([s,last]);s=x;}last=x;}
  if(s>=0)segs.push([s,last]);
  return segs.map(([a,b])=>((a+b)/2)/W);   // centre of each word, as a fraction of the line
}

/* ---------- lyrics: Cecilia's calligraphy sheet, one line at a time ---------- */
// approximate vertical centre of each written line on the sheet (original pixels)
const LINE_Y=[128,230,363,470,670,782,883,1019,1240,1390,1524,1659,1824,1950,2090,2194,2297,2415];
let LINES=null,INK=null;
// each stroke of ink is traced as a whole and given to the written line it sits on, so loops and tails stay with their letters
{const im=new Image();im.onload=()=>{
  const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.drawImage(im,0,0);const d=x.getImageData(0,0,W,H).data;
  const ink=new Uint8Array(W*H);for(let i=0;i<W*H;i++){const v=255-(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);ink[i]=v>255?255:v<0?0:v;}
  const lab=new Int32Array(W*H),stack=new Int32Array(W*H);const comps=[null];
  for(let p0=0;p0<W*H;p0++){if(lab[p0]||ink[p0]<28)continue;
    const id=comps.length;let sp=0,n=0,sx=0,sy=0,x0=W,x1=0,y0=H,y1=0;stack[sp++]=p0;lab[p0]=id;
    while(sp){const p=stack[--sp],px=p%W,py=(p-px)/W;n++;sx+=px;sy+=py;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const qx=px+dx,qy=py+dy;if(qx<0||qy<0||qx>=W||qy>=H)continue;const q=qy*W+qx;if(!lab[q]&&ink[q]>=28){lab[q]=id;stack[sp++]=q;}}}
    let line=-1;if(n>=8){const my=sy/n;let best=1e9;LINE_Y.forEach((ly,i)=>{const dd=Math.abs(ly-my);if(dd<best){best=dd;line=i;}});}
    comps.push({line,cx:sx/n,x0,x1,y0,y1});}
  const pieces=LINE_Y.map((_,i)=>({line:i,pick:()=>true}));
  // the three "You wish" and the "i would" (sheet columns: each "You wish" ends before x 390)
  pieces.push({line:8,pick:k=>k.cx<390},{line:8,pick:k=>k.cx>=390},{line:9,pick:k=>k.cx<390},{line:9,pick:k=>k.cx>=390});
  const keep=pieces.map(pc=>{const set=new Uint8Array(comps.length);comps.forEach((k,id)=>{if(k&&k.line===pc.line&&pc.pick(k))set[id]=1;});return set;});
  const box=pieces.map((pc,j)=>{const b={x0:W,x1:0,y0:H,y1:0};comps.forEach((k,id)=>{if(keep[j][id]){b.x0=Math.min(b.x0,k.x0);b.x1=Math.max(b.x1,k.x1);b.y0=Math.min(b.y0,k.y0);b.y1=Math.max(b.y1,k.y1);}});return b;});
  const hi=new Image();hi.onload=()=>{const S=hi.naturalWidth/W;
  const L0=box.map((b,j)=>{const K=keep[j],pad=3,bx=Math.max(0,b.x0-pad),by=Math.max(0,b.y0-pad),bw=Math.min(W,b.x1+pad+1)-bx,bh=Math.min(H,b.y1+pad+1)-by;
    const cw=Math.round(bw*S),ch=Math.round(bh*S),o=document.createElement('canvas');o.width=cw;o.height=ch;const ox=o.getContext('2d');
    ox.drawImage(hi,bx*S,by*S,bw*S,bh*S,0,0,cw,ch);const od=ox.getImageData(0,0,cw,ch),D=od.data;
    for(let y=0;y<ch;y++){const sy=by+Math.min(bh-1,Math.floor(y/S));for(let xx=0;xx<cw;xx++){const sx=bx+Math.min(bw-1,Math.floor(xx/S)),sp=sy*W+sx,di=(y*cw+xx)*4;
      let ok=lab[sp]>0&&K[lab[sp]]===1;
      if(!ok&&!lab[sp]){for(let dy=-1;dy<=1&&!ok;dy++)for(let dx=-1;dx<=1;dx++){const q=sp+dy*W+dx;if(q>=0&&q<W*H&&lab[q]&&K[lab[q]]){ok=true;break;}}}
      const v=255-(D[di]*.3+D[di+1]*.59+D[di+2]*.11);D[di]=D[di+1]=D[di+2]=0;D[di+3]=ok?Math.max(0,Math.min(255,(v-12)*1.3)):0;}}
    ox.putImageData(od,0,0);return{c:o,w:bw,h:bh};});
  // white ink, written in as it is sung
  const tint=(c,col)=>{const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const g=o.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle=col;g.fillRect(0,0,o.width,o.height);return o;};
  L0.forEach(L=>{L.lit=tint(L.c,'#fff');L.words=words(L.c);});
  INK={w:Math.max(...box.slice(0,LINE_Y.length).map(b=>b.x1-b.x0))};LINES=L0;
  };hi.src='lyrics-4x.jpg';
};im.src='lyrics.jpg';}

// [sheet line, start, end] in seconds of the song, from where each line is sung
const CUES=[[0,11.1,15.2],[1,15.4,20.5],[2,20.7,24.9],[3,25.1,30.3],[4,32.3,35.9],[5,36.1,41.6],[6,42.3,46.1],[7,46.2,51.8],
  [21,56.6,58.9],[10,59.1,61.1],[11,61.2,64.2],[12,64.4,68.1],[13,68.3,73.0],
  [14,99.3,103.7],[15,103.9,110.2],[16,110.4,113.2],[17,113.4,118.2],
  [21,147.6,149.5],[10,149.7,152.1],[11,152.3,155.1],[12,155.3,158.3],[13,158.5,164.6]];
// "you wish, you wish, you wish": each lands on top of the last, very big, a woman appearing for each
const STACKS=[{at:[52.6,54.5,55.7],end:56.6,w:['bar','fan','absinthe']},{at:[143.6,145.4,146.6],end:147.6,w:['violets','railway','nana']}];
const COUNT_IN=[11.1,99.3,143.6];   // verses that start after a long rest: their first line waits on screen a little longer


/* ---------- who bounces when: a new woman for every line ---------- */
const ORDER=['violets','railway','loge','absinthe','repos','lady','nana','cradle','balcony','fan','bar'];
const WHO=CUES.map((c,i)=>ORDER[i%ORDER.length]);

/* ---------- drawing ---------- */
const C=document.getElementById('stage'),cx=C.getContext('2d');
// where the woman is along a line: she hops from word to word, landing on each as the ink reaches it
function hop(ws,p){
  const pts=[-.06,...ws];let i=0;while(i<pts.length-1&&p>pts[i+1])i++;
  if(i>=pts.length-1)return{x:pts[pts.length-1],y:0,land:1};
  const a=pts[i],b=pts[i+1],u=Math.max(0,Math.min(1,(p-a)/(b-a)));
  return{x:a+(b-a)*u,y:Math.sin(Math.PI*u)*Math.min(1,(b-a)*5),land:u};
}
function woman(k,x,yBase,size,lift,land,alpha){
  const im=WOMEN[k];if(!im.complete||!im.naturalWidth)return;
  const h=size,w=h*im.naturalWidth/im.naturalHeight;
  const sq=land>.92||land<.08?.93:1;   // a small squash where she touches the word
  cx.globalAlpha=alpha;cx.save();cx.translate(x,yBase-lift);cx.scale(1/sq*(sq<1?1.03:1),sq);
  cx.drawImage(im,-w/2,-h,w,h);cx.restore();
}
function drawLine(L,mx,my,sc,alpha,p){
  const w=L.w*sc,h=L.h*sc,x=mx-w/2,y=my-h/2;
  if(p>0){cx.globalAlpha=alpha;cx.save();cx.beginPath();cx.rect(x-4,y-20,w*p+4,h+40);cx.clip();cx.drawImage(L.lit,x,y,w,h);cx.restore();}
  return{x,y,w,h};
}
function ride(L,k,mx,my,sc,a,p,W,H){
  const b=drawLine(L,mx,my,sc,a,p),q=hop(L.words,p),size=Math.min(H*.26,W*.34),jump=Math.min(H*.16,size*.8);
  woman(k,b.x+q.x*b.w,b.y-size*.02,size,q.y*jump,q.land,a);
}
function frame(){
  const t=clock(),W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio,2);
  if(C.width!==Math.round(W*dpr)||C.height!==Math.round(H*dpr)){C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);}
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,C.width,C.height);cx.setTransform(dpr,0,0,dpr,0,0);cx.imageSmoothingQuality='high';
  const g=Math.max(16,W*.06);
  if(!started&&!TEST){woman('bar',W/2,H*.62,Math.min(H*.32,W*.5),0,.5,1);}
  else if(LINES){
    const S=STACKS.find(z=>t>=z.at[0]&&t<z.end);
    if(S){S.at.forEach((t0,k)=>{if(t<t0)return;const L=LINES[18+k],a=Math.min(1,(t-t0)/.2,(S.end-t)/.3),
        sc=Math.min((W-2*g)/L.w,H*.4/L.h),p=Math.min(1,(t-t0)/Math.max(.4,((S.at[k+1]||S.end)-t0)*.8)),
        cur=k===S.at.filter(x=>t>=x).length-1;
        if(cur)ride(L,S.w[k],W/2,H*.62,sc,Math.max(0,a),p,W,H);else drawLine(L,W/2,H*.62,sc,Math.max(0,a),p);});}
    else for(let i=0;i<CUES.length;i++){const c=CUES[i],prevEnd=i?CUES[i-1][2]:0,
        lead=COUNT_IN.includes(c[1])?3:Math.min(1.2,Math.max(.2,c[1]-prevEnd));
      if(t<c[1]-lead||t>=c[2]+.2)continue;
      const L=LINES[c[0]],a=Math.min(1,(t-(c[1]-lead))/.35,(c[2]+.2-t)/.3),p=Math.min(1,Math.max(0,(t-c[1])/Math.max(.5,c[2]-c[1]-.25)));
      const sc=Math.min(3*(W-2*g)/INK.w,(W-2*g)/L.w,H*.18/L.h);
      ride(L,WHO[i],W/2,H*.64,sc,a,p,W,H);
      break;}
  }
  cx.globalAlpha=1;
  if(started&&song.ended)finish();
  requestAnimationFrame(frame);
}

/* ---------- the song drives everything ---------- */
const song=new Audio('song.mp3');song.preload='auto';
const TEST=+new URLSearchParams(location.search).get('t')||0;
let started=false;
const clock=()=>started?song.currentTime:TEST;
function start(){if(started)return;started=true;song.currentTime=TEST;song.play().catch(()=>{started=false;});}
function finish(){started=false;song.currentTime=0;}
C.addEventListener('click',()=>{if(!started)start();else if(song.paused)song.play();else song.pause();});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();C.click();}});
requestAnimationFrame(frame);
})();
</script>
