<meta charset="utf-8">
<title>Banyuls House 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-screen 3D scene, one compact control panel pinned top-left, move pad bottom-right while walking */
:root {
  --ink: #f3f1ee;
  --muted: #b9b4ad;
  --panel: rgba(22, 24, 27, 0.8);
  --line: rgba(243, 241, 238, 0.18);
  --accent: #e0a46a;
  --sky: #2a2f36;
  --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--sky); color: var(--ink); font-family: var(--font); overflow: hidden; }
#scene { position: fixed; inset: 0; touch-action: none; }
#scene canvas { display: block; width: 100%; height: 100%; }

.panel {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: min(310px, calc(100vw - 32px));
  max-height: calc(100% - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
  background: var(--panel);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  display: grid;
  gap: 12px;
  z-index: 5;
  box-sizing: border-box;
}
.panel h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.panel .sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.group { display: grid; gap: 6px; }
.group-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
button {
  font: inherit; font-size: 12px; font-weight: 600;
  color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 5px;
  padding: 6px 10px; cursor: pointer;
}
button[aria-pressed="true"] { background: var(--ink); color: #16181b; border-color: var(--ink); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gain { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--muted); }
.gain b { font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.help { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.45; }
.panel.min > :not(.head) { display: none; }
.head { display: flex; justify-content: space-between; align-items: start; gap: 8px; }

.label {
  position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none;
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
  color: #16181b; background: rgba(243, 241, 238, 0.92);
  padding: 3px 6px; border-radius: 3px;
}
.label.dim { background: var(--accent); font-size: 13px; }
.labels-off .label { display: none; }

.pad {
  position: fixed; z-index: 5;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(2, 48px); gap: 6px;
}
.pad button { background: var(--panel); font-size: 18px; padding: 0; }
.pad .up { grid-column: 2; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
</style>

<div id="scene" aria-label="3D model of the house"></div>

<div class="panel" id="panel">
  <div class="head">
    <div>
      <h1>Banyuls house</h1>
      <p class="sub">Built from the surveyor's plans and sections</p>
    </div>
    <button id="min" aria-label="Hide panel">–</button>
  </div>
  <div class="group">
    <span class="group-label">Look</span>
    <div class="row">
      <button id="v-out" aria-pressed="true">Outside</button>
      <button id="v-cut1" aria-pressed="false">First floor</button>
      <button id="v-cut0" aria-pressed="false">Ground floor</button>
    </div>
  </div>
  <div class="group">
    <span class="group-label">Walk inside</span>
    <div class="row">
      <button id="w-1" aria-pressed="false">First floor</button>
      <button id="w-0" aria-pressed="false">Ground floor</button>
    </div>
  </div>
  <div class="group">
    <span class="group-label">Show</span>
    <div class="row">
      <button id="t-ceil" aria-pressed="true">False ceiling</button>
      <button id="t-beams" aria-pressed="true">Ceiling beams</button>
      <button id="t-roof" aria-pressed="true">Roof</button>
      <button id="t-lab" aria-pressed="true">Labels</button>
    </div>
  </div>
  <div class="gain"><span>Height gained under the ridge without the false ceiling</span><b>1,55 m</b></div>
  <p class="help" id="help">Drag to turn. Scroll or pinch to zoom.</p>
</div>

<div class="pad" id="pad" hidden>
  <button class="up" data-k="f" aria-label="Walk forward">▲</button>
  <button class="left" data-k="l" aria-label="Step left">◀</button>
  <button class="down" data-k="b" aria-label="Walk back">▼</button>
  <button class="right" data-k="r" aria-label="Step right">▶</button>
</div>

<script>
// Plan frame: u across the pitched roof, v along its ridge (metres). Levels are NGF metres.
// Scene: X = u − CU, Z = −(v − CV), Y = level − BASE.
const MODEL = JSON.parse(document.getElementById("model").textContent);
const BASE = 117.75;
const [BU0, BV0, BU1, BV1] = MODEL.bounds;
const LB = MODEL.leftBlock;
const CU = (LB[0] + 54.7) / 2, CV = (31.6 + LB[3]) / 2;
const X = u => u - CU, Z = v => -(v - CV), Y = l => l - BASE;
const SX = x => X(x + 48.61);          // section A-A' x → plan u (measured on the ridge beam)

// ---------- renderer ----------
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.localClippingEnabled = true;
// Cutaway views slice the walls like a plan; far above the house means no cut
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1000);
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 300);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.495;

scene.add(new THREE.HemisphereLight(0xdfe8f2, 0xcfc4b4, 0.6));
const ambient = new THREE.AmbientLight(0xfff4e6, 0.2);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff1dc, 1.5);
sun.position.set(-14, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 70 });
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.PointLight(0xffe2bd, 0.9, 14, 1.2);
scene.add(fill);

// ---------- textures ----------
function canvasTex(w, h, draw, rep) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (rep) t.repeat.set(rep[0], rep[1]);
  return t;
}
scene.background = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, "#5d7894"); gr.addColorStop(0.55, "#a9bccb"); gr.addColorStop(1, "#d9d4c9");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
function wood(base, dark, rep) {
  return canvasTex(512, 128, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      g.strokeStyle = dark; g.globalAlpha = 0.08 + Math.random() * 0.18; g.lineWidth = 0.6 + Math.random() * 2.2;
      const y = Math.random() * h; g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= w; x += 32) g.lineTo(x, y + Math.sin(x / 70 + i) * 3 + (Math.random() - 0.5) * 2);
      g.stroke();
    }
    g.globalAlpha = 1;
  }, rep);
}
const plaster = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#ece7df"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.04})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});
const tiles = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#a9512c"; g.fillRect(0, 0, w, h);
  const cw = w / 4, rh = h / 4;
  for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) {
    const x = c * cw + (r % 2 ? cw / 2 : 0) - cw / 2, y = r * rh;
    const gr = g.createLinearGradient(x, 0, x + cw, 0);
    gr.addColorStop(0, "#7c3519"); gr.addColorStop(0.5, `hsl(${16 + Math.random() * 6}, 55%, ${40 + Math.random() * 8}%)`); gr.addColorStop(1, "#7c3519");
    g.fillStyle = gr; g.fillRect(x + 2, y, cw - 4, rh - 3);
  }
}, [6, 6]);
const terraceTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#b8a48e"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(60,40,25,0.35)"; g.lineWidth = 2;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(i * w / 4, 0); g.lineTo(i * w / 4, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 4); g.lineTo(w, i * h / 4); g.stroke(); }
});
const floorTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = "#a5815c"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "rgba(80,60,40,0.25)"; g.lineWidth = 2;
  for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * w / 8, 0); g.lineTo(i * w / 8, h); g.stroke(); g.beginPath(); g.moveTo(0, i * h / 8); g.lineTo(w, i * h / 8); g.stroke(); }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
});

const M = {
  wall: new THREE.MeshStandardMaterial({ map: plaster, color: 0xf3ede4, roughness: 0.95 }),
  part: new THREE.MeshStandardMaterial({ map: plaster, color: 0xffffff, roughness: 0.95 }),
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.8 }),
  ceil: new THREE.MeshStandardMaterial({ map: plaster, roughness: 0.95, side: THREE.DoubleSide }),
  fceil: new THREE.MeshStandardMaterial({ map: plaster, color: 0xfffaf2, roughness: 0.95, side: THREE.DoubleSide }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbcd6e6, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  beam: new THREE.MeshStandardMaterial({ map: wood("#6e4524", "#2c180a"), roughness: 0.8 }),
  rafter: new THREE.MeshStandardMaterial({ map: wood("#8a5a33", "#3a210f"), roughness: 0.85 }),
  joist: new THREE.MeshStandardMaterial({ map: wood("#9a6b40", "#4b2c14"), roughness: 0.85 }),
  board: new THREE.MeshStandardMaterial({ map: wood("#b98a5c", "#6d4626", [3, 8]), roughness: 0.9, side: THREE.DoubleSide }),
  tile: new THREE.MeshStandardMaterial({ map: tiles, roughness: 0.75 }),
  terrace: new THREE.MeshStandardMaterial({ map: terraceTex, roughness: 0.9 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x8f897c, roughness: 1 }),
};
const WOOD = [M.beam, M.rafter, M.joist];
for (const m of [M.wall, M.part, M.glass]) { m.clippingPlanes = [cutPlane]; m.clipShadows = true; }
M.wall.side = THREE.DoubleSide; M.part.side = THREE.DoubleSide;

function setupUV(geo, scale) {
  // World-scaled planar UVs so textures keep a constant size on every surface
  const p = geo.attributes.position, n = geo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i));
    const a = ax > 0.5 ? p.getZ(i) : p.getX(i);
    const b = ay > 0.5 ? p.getZ(i) : p.getY(i);
    uv[2 * i] = a / scale; uv[2 * i + 1] = b / scale;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  return geo;
}
function mesh(geo, mat, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m;
}
function boxGeo(u0, v0, u1, v1, z0, z1) {
  const g = new THREE.BoxGeometry(Math.abs(u1 - u0), Math.max(z1 - z0, 0.005), Math.abs(v1 - v0));
  g.translate(X((u0 + u1) / 2), Y((z0 + z1) / 2), Z((v0 + v1) / 2));
  return g;
}
function merged(geos, mat, scale = 1.2, cast = true) {
  if (!geos.length) return new THREE.Group();
  const g = THREE.BufferGeometryUtils.mergeBufferGeometries(geos.map(x => x.toNonIndexed ? x.toNonIndexed() : x));
  g.computeVertexNormals();
  return mesh(setupUV(g, scale), mat, cast, true);
}
function extrude(outer, holes, z0, z1) {
  const shape = new THREE.Shape(outer.map(p => new THREE.Vector2(X(p[0]), p[1] - CV)));
  for (const h of holes) shape.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(X(p[0]), p[1] - CV))));
  const g = new THREE.ExtrudeGeometry(shape, { depth: z1 - z0, bevelEnabled: false });
  g.rotateX(-Math.PI / 2);
  g.translate(0, Y(z0), 0);
  return g;
}

// ---------- groups ----------
const G = {
  s0: new THREE.Group(), s1: new THREE.Group(),
  ceil0: new THREE.Group(), ceil1: new THREE.Group(), falseCeil: new THREE.Group(),
  beams: new THREE.Group(), roof: new THREE.Group(), terrace: new THREE.Group(),
};
Object.values(G).forEach(g => scene.add(g));

const ground = mesh(new THREE.PlaneGeometry(160, 160), M.ground, false, true);
ground.rotation.x = -Math.PI / 2; ground.position.y = Y(117.55); scene.add(ground);

// Walls and partitions
const wallGeos = { "0E": [], "1E": [] }, partGeos = { "0E": [], "1E": [] };
for (const w of MODEL.walls) (w.kind === "wall" ? wallGeos : partGeos)[w.floor].push(extrude(w.outer, w.holes, w.z0, w.z1));
G.s0.add(merged(wallGeos["0E"], M.wall), merged(partGeos["0E"], M.part));
G.s1.add(merged(wallGeos["1E"], M.wall), merged(partGeos["1E"], M.part));

// Lintels, sills and window glass
const inf = { s0: [], s1: [] }, gl = { s0: [], s1: [] };
for (const b of MODEL.infill) inf[b.z0 < 120.4 ? "s0" : "s1"].push(boxGeo(b.rect[0], b.rect[1], b.rect[2], b.rect[3], b.z0, b.z1));
for (const b of MODEL.glass) {
  const r = b.rect, along = (r[2] - r[0]) >= (r[3] - r[1]);
  const mu = (r[0] + r[2]) / 2, mv = (r[1] + r[3]) / 2;
  gl[b.z0 < 120.4 ? "s0" : "s1"].push(along ? boxGeo(r[0], mv - 0.01, r[2], mv + 0.01, b.z0, b.z1) : boxGeo(mu - 0.01, r[1], mu + 0.01, r[3], b.z0, b.z1));
}
G.s0.add(merged(inf.s0, M.wall), merged(gl.s0, M.glass, 1, false));
G.s1.add(merged(inf.s1, M.wall), merged(gl.s1, M.glass, 1, false));

// Floors and ceilings, room by room
const floorRects = { "0E": [], "1E": [] };
const fl = { "0E": [], "1E": [] }, ce = { "0E": [], "1E": [], false: [] };
for (const f of MODEL.floors) {
  const t = f.floor === "0E" ? 0.08 : 0.30;
  for (const r of f.rects) { fl[f.floor].push(boxGeo(r[0], r[1], r[2], r[3], f.z - t, f.z)); floorRects[f.floor].push([r, f.z]); }
}
for (const c of MODEL.ceilings) {
  const key = c.kind === "false" ? "false" : c.floor;
  for (const r of c.rects) ce[key].push(boxGeo(r[0], r[1], r[2], r[3], c.z, c.z + 0.02));
}
G.s0.add(merged(fl["0E"], M.floor, 2));
G.s1.add(merged(fl["1E"], M.floor, 2));
G.ceil0.add(merged(ce["0E"], M.ceil, 2));
G.ceil1.add(merged(ce["1E"], M.ceil, 2));
G.falseCeil.add(merged(ce.false, M.fceil, 2));

// Roof terrace over the right block, slab plus tiled top
const tg = [];
for (const r of MODEL.terrace) tg.push(boxGeo(r[0], r[1], r[2], r[3], MODEL.terraceZ[0], MODEL.terraceZ[1]));
G.terrace.add(merged(tg, M.terrace, 1.5));

// ---------- pitched roof over the left block (section A-A' geometry) ----------
const V_A = LB[1], V_B = LB[3];                    // outer faces of the two gable walls
const GT = 0.45;                                    // gable wall thickness
const RAF_L = { x0: SX(-5.208), y0: Y(123.561), x1: SX(-1.469), y1: Y(124.983) };
const RAF_R = { x0: SX(2.185), y0: Y(123.598), x1: SX(-1.469), y1: Y(124.983) };
const slopeL = (RAF_L.y1 - RAF_L.y0) / (RAF_L.x1 - RAF_L.x0);
const slopeR = (RAF_R.y1 - RAF_R.y0) / (RAF_R.x0 - RAF_R.x1);
const RAF_D = 0.084;
const rafTopL = x => RAF_L.y0 + RAF_D + (x - RAF_L.x0) * slopeL;
const rafTopR = x => RAF_R.y0 + RAF_D + (RAF_R.x0 - x) * slopeR;
const RX = RAF_L.x1;
const EAVE_L = SX(-5.75), EAVE_R = SX(2.75);
const zA = Z(V_A), zB = Z(V_B);                     // zA > zB

function prism(pts, za, zb, mat) {
  const s = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.abs(za - zb), bevelEnabled: false });
  g.translate(0, 0, Math.min(za, zb));
  return mesh(setupUV(g, 1.2), mat);
}
// Gable triangles above the wall tops
const wallTop = Y(123.56);
const gable = [[X(LB[0]), wallTop], [X(LB[2]), wallTop], [X(LB[2]), rafTopR(X(LB[2]))], [RX, rafTopL(RX)], [X(LB[0]), rafTopL(X(LB[0]))]];
G.roof.add(prism(gable, zA, Z(V_A + GT), M.wall));
G.roof.add(prism(gable, zB, Z(V_B - GT), M.wall));

const angL = Math.atan(slopeL), angR = Math.atan(slopeR);
const rafters = [];
for (let v = V_A + GT + 0.1; v <= V_B - GT - 0.05; v += 0.35) {
  for (const side of [-1, 1]) {
    const r = side < 0 ? RAF_L : RAF_R;
    const xe = side < 0 ? EAVE_L : EAVE_R;
    const ye = side < 0 ? r.y0 + (xe - r.x0) * slopeL : r.y0 + (r.x0 - xe) * slopeR;
    const len = Math.hypot(r.x1 - xe, r.y1 - ye);
    const g = new THREE.BoxGeometry(len, RAF_D * Math.cos(side < 0 ? angL : angR), 0.07);
    g.rotateZ(side < 0 ? angL : -angR);
    g.translate((xe + r.x1) / 2, (ye + r.y1) / 2 + RAF_D / 2, Z(v));
    rafters.push(g);
  }
}
G.roof.add(merged(rafters, M.rafter));
function slab(side, t0, t1, mat) {
  const top = side < 0 ? rafTopL : rafTopR, xe = side < 0 ? EAVE_L : EAVE_R;
  return prism([[xe, top(xe) + t0], [RX, top(RX) + t0], [RX, top(RX) + t1], [xe, top(xe) + t1]], zA + 0.3, zB - 0.3, mat);
}
for (const s of [-1, 1]) { G.roof.add(slab(s, 0, 0.025, M.board)); G.roof.add(slab(s, 0.025, 0.17, M.tile)); }
const cap = mesh(new THREE.CylinderGeometry(0.09, 0.09, Math.abs(zA - zB) + 0.6, 16, 1, false, 0, Math.PI), M.tile);
cap.rotation.x = Math.PI / 2; cap.rotation.y = Math.PI / 2;
cap.position.set(RX, rafTopL(RX) + 0.15, (zA + zB) / 2); G.roof.add(cap);

// Ridge beam and purlins (sections measured on the DWG), spanning gable to gable
const span = [Z(V_A + GT), Z(V_B - GT)];
function beam(w, h, x, y, rot, mat, grp) {
  const g = new THREE.BoxGeometry(w, h, Math.abs(span[0] - span[1]) + 0.3);
  const m = mesh(g, mat); m.position.set(x, y, (span[0] + span[1]) / 2); m.rotation.z = rot; grp.add(m); return m;
}
beam(0.182, 0.30, SX(-1.483), Y(124.80), 0, M.beam, G.roof);
beam(0.17, 0.338, SX(-3.3175), Y(124.0625), THREE.MathUtils.degToRad(22.2), M.beam, G.roof);
beam(0.162, 0.355, SX(0.3155), Y(124.0727), THREE.MathUtils.degToRad(-20.3), M.beam, G.roof);

// Ceiling beams: three 9 × 16 beams and the joists that carry the false ceiling
for (const [x, y] of [[-3.2525, 123.4795], [-1.4575, 123.456], [0.311, 123.479]]) beam(0.089, 0.159, SX(x), Y(y), 0, M.beam, G.beams);
const joists = [];
for (let v = V_A + GT + 0.2; v <= V_B - GT - 0.1; v += 0.40) {
  const g = new THREE.BoxGeometry(SX(2.181) - SX(-5.208), 0.05, 0.04);
  g.translate((SX(2.181) + SX(-5.208)) / 2, Y(123.455), Z(v)); joists.push(g);
}
G.beams.add(merged(joists, M.joist));

// ---------- labels ----------
const labels = [];
function label(text, p, cls = "") {
  const el = document.createElement("div"); el.className = "label " + cls; el.textContent = text;
  document.body.appendChild(el); labels.push({ el, pos: new THREE.Vector3(...p) }); return el;
}
const zMid = (span[0] + span[1]) / 2;
label("Faîtière 18 × 30 cm", [SX(-1.483), Y(124.62), zMid + 1.6]);
label("Panne 17 × 34 cm", [SX(-3.3175), Y(123.72), zMid + 1.2]);
label("Panne 16 × 36 cm", [SX(0.3155), Y(123.72), zMid + 1.2]);
label("Poutres 9 × 16 cm", [SX(-1.4575), Y(123.70), zMid - 1.0]);
label("1,55 m", [SX(-1.05), Y((123.10 + 124.649) / 2), zMid], "dim");
const dimMat = new THREE.LineBasicMaterial({ color: 0xe0a46a, depthTest: false });
const dimGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(SX(-1.2), Y(123.10), zMid), new THREE.Vector3(SX(-1.2), Y(124.649), zMid),
  new THREE.Vector3(SX(-1.28), Y(123.10), zMid), new THREE.Vector3(SX(-1.12), Y(123.10), zMid),
  new THREE.Vector3(SX(-1.28), Y(124.649), zMid), new THREE.Vector3(SX(-1.12), Y(124.649), zMid)]);
const dim = new THREE.LineSegments(dimGeo, dimMat); dim.renderOrder = 10; scene.add(dim);

// ---------- views ----------
let mode = "out", walkFloor = "1E";
const look = { yaw: 0, pitch: 0 };
const ids = ["v-out", "v-cut1", "v-cut0", "w-1", "w-0"];
function press(id) { ids.forEach(i => document.getElementById(i).setAttribute("aria-pressed", i === id)); }
const state = { ceil: true, beams: true, roof: true };
function applyVisibility() {
  const cut1 = mode === "cut1", cut0 = mode === "cut0";
  const walking1 = mode === "walk" && walkFloor === "1E";
  G.roof.visible = state.roof && !cut1 && !cut0;
  G.terrace.visible = state.roof && !cut1 && !cut0;
  G.s1.visible = !cut0;
  G.ceil1.visible = !cut1 && !cut0;
  G.falseCeil.visible = state.ceil && !cut0 && !(cut1 && !state.ceil);
  if (cut1) G.falseCeil.visible = false;
  G.beams.visible = state.beams && !cut0 && !cut1;
  G.ceil0.visible = !cut0 && !(mode === "walk" && walkFloor === "1E" && false);
  dim.visible = document.getElementById("t-lab").getAttribute("aria-pressed") === "true" && !cut0 && !cut1;
}
function setView(v) {
  mode = v; press("v-" + v);
  ambient.intensity = 0.2;
  document.getElementById("pad").hidden = true;
  controls.enabled = true;
  camera.fov = 45;
  cutPlane.constant = v === "cut1" ? Y(122.3) : v === "cut0" ? Y(119.4) : 1000;
  if (v === "out") { camera.position.set(-17, 14, 20); controls.target.set(0, 3, 0); }
  if (v === "cut1") { camera.position.set(-6, 20, 15); controls.target.set(0, 3, 0); }
  if (v === "cut0") { camera.position.set(-6, 18, 14); controls.target.set(0, 0, 0); }
  document.getElementById("help").textContent = "Drag to turn. Scroll or pinch to zoom.";
  camera.updateProjectionMatrix(); controls.update(); applyVisibility();
}
const START = { "1E": { u: 45.2, v: 39.0, yaw: -0.6, pitch: 0.2 }, "0E": { u: 46.0, v: 41.0, yaw: 2.4, pitch: 0.05 } };
function walk(f) {
  mode = "walk"; walkFloor = f; press(f === "1E" ? "w-1" : "w-0");
  cutPlane.constant = 1000;
  ambient.intensity = 0.45;
  document.getElementById("pad").hidden = false;
  controls.enabled = false;
  camera.fov = 72; camera.updateProjectionMatrix();
  const s = START[f];
  camera.position.set(X(s.u), 0, Z(s.v)); look.yaw = s.yaw; look.pitch = s.pitch;
  document.getElementById("help").textContent = "Drag to look around. Walk with W A S D, the arrow keys or the pad.";
  applyVisibility();
}
function toggle(id, fn) {
  const b = document.getElementById(id);
  b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); fn(on); applyVisibility(); });
}
toggle("t-ceil", on => { state.ceil = on; });
toggle("t-beams", on => { state.beams = on; });
toggle("t-roof", on => { state.roof = on; });
toggle("t-lab", on => { document.body.classList.toggle("labels-off", !on); });
document.getElementById("v-out").onclick = () => setView("out");
document.getElementById("v-cut1").onclick = () => setView("cut1");
document.getElementById("v-cut0").onclick = () => setView("cut0");
document.getElementById("w-1").onclick = () => walk("1E");
document.getElementById("w-0").onclick = () => walk("0E");
document.getElementById("min").onclick = e => {
  const m = document.getElementById("panel").classList.toggle("min");
  e.currentTarget.textContent = m ? "+" : "–"; e.currentTarget.setAttribute("aria-label", m ? "Show panel" : "Hide panel");
};

// ---------- walking ----------
const keys = new Set();
const keyMap = { KeyW: "f", ArrowUp: "f", KeyS: "b", ArrowDown: "b", KeyA: "l", ArrowLeft: "l", KeyD: "r", ArrowRight: "r" };
addEventListener("keydown", e => { if (mode === "walk" && keyMap[e.code]) { keys.add(keyMap[e.code]); e.preventDefault(); } });
addEventListener("keyup", e => keys.delete(keyMap[e.code]));
document.querySelectorAll(".pad button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { keys.add(k); b.setPointerCapture(e.pointerId); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => b.addEventListener(ev, () => keys.delete(k)));
});
let drag = null;
renderer.domElement.addEventListener("pointerdown", e => { if (mode === "walk") drag = { x: e.clientX, y: e.clientY }; });
addEventListener("pointermove", e => {
  if (!drag || mode !== "walk") return;
  look.yaw -= (e.clientX - drag.x) * 0.004;
  look.pitch = Math.max(-1.2, Math.min(1.35, look.pitch - (e.clientY - drag.y) * 0.004));
  drag = { x: e.clientX, y: e.clientY };
});
addEventListener("pointerup", () => drag = null);
let eye = 0;
function floorAt(f, u, v) {
  for (const [r, z] of floorRects[f]) if (u >= r[0] && u <= r[2] && v >= r[1] && v <= r[3]) return z;
  return null;
}

// ---------- loop ----------
function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
const v3 = new THREE.Vector3();
const ray = new THREE.Raycaster();
const solids = [];
scene.traverse(o => { if (o.isMesh && !WOOD.includes(o.material) && o.material !== M.glass && o !== ground) solids.push(o); });
function visibleChain(o) { for (let p = o; p; p = p.parent) if (!p.visible) return false; return true; }
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mode === "walk") {
    const fwd = (keys.has("f") ? 1 : 0) - (keys.has("b") ? 1 : 0);
    const side = (keys.has("r") ? 1 : 0) - (keys.has("l") ? 1 : 0);
    const sp = 1.5 * dt;
    camera.position.x += (-Math.sin(look.yaw) * fwd + Math.cos(look.yaw) * side) * sp;
    camera.position.z += (-Math.cos(look.yaw) * fwd - Math.sin(look.yaw) * side) * sp;
    const u = camera.position.x + CU, v = CV - camera.position.z;
    const z = floorAt(walkFloor, u, v);
    if (z !== null) eye = Y(z) + 1.6;
    else if (!eye) eye = Y(walkFloor === "1E" ? 120.7 : 117.85) + 1.6;
    camera.position.y += (eye - camera.position.y) * Math.min(1, dt * 8);
    fill.position.set(camera.position.x, camera.position.y + 0.6, camera.position.z);
    const dir = new THREE.Vector3(-Math.sin(look.yaw) * Math.cos(look.pitch), Math.sin(look.pitch), -Math.cos(look.yaw) * Math.cos(look.pitch));
    camera.lookAt(v3.copy(camera.position).add(dir));
  } else {
    controls.update();
    fill.position.set(0, Y(122.5), 0);
  }
  renderer.render(scene, camera);
  const w = host.clientWidth, h = host.clientHeight;
  const occluders = solids.filter(visibleChain);
  for (const l of labels) {
    v3.copy(l.pos).project(camera);
    let vis = v3.z < 1 && Math.abs(v3.x) < 1.1 && Math.abs(v3.y) < 1.1 && !(mode === "cut0" || mode === "cut1");
    if (vis) {
      const d = camera.position.distanceTo(l.pos);
      ray.set(camera.position, l.pos.clone().sub(camera.position).normalize()); ray.far = d - 0.25;
      if (ray.intersectObjects(occluders, false).length) vis = false;
    }
    l.el.style.visibility = vis ? "visible" : "hidden";
    if (vis) l.el.style.transform = `translate(${(v3.x + 1) / 2 * w}px, ${(1 - v3.y) / 2 * h}px) translate(-50%, -50%)`;
  }
  requestAnimationFrame(frame);
}
resize();
setView("out");
frame();
</script>
