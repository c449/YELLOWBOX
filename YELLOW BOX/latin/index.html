*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { background: #fff; }

body {
  background: #fff;
  color: #000;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: 700;
  text-transform: uppercase;
  overflow: clip;
}

#input-view, #output-view {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

#output-view { display: none; }

#src {
  height: min(78dvh, 138vw);
  aspect-ratio: 2 / 3;
  background: #fff;
  color: #000;
  font-family: inherit;
  font-size: clamp(11px, 1.7vw, 13px);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 2px;
  line-height: 1.3;
  text-align: center;
  padding: 0 6%;
  display: flex;
  align-items: center;
  justify-content: center;
  outline: none;
  overflow-wrap: anywhere;
}

#src:empty::before { content: attr(data-ph); }

#count {
  font-size: clamp(11px, 1.7vw, 13px);
  font-weight: 700;
  letter-spacing: 2px;
  color: #000;
}

.btn {
  background: none;
  border: none;
  color: #000;
  font-family: inherit;
  font-size: clamp(11px, 1.7vw, 13px);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  padding: 8px 12px;
  -webkit-tap-highlight-color: transparent;
}

.btn:hover { color: #000; }
.btn:disabled { color: #000; cursor: default; }

#poster {
  height: min(78dvh, 138vw);
  aspect-ratio: 2 / 3;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6%;
  overflow: hidden;
}

#latin {
  font-family: 'cecilia', Georgia, serif;
  font-weight: 400;
  width: 100%;
}

#latin .word {
  white-space: nowrap;
  line-height: 0.78;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: -0.06em;
}

.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
}

.check input {
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  border: 1.5px solid #000;
  border-radius: 0;
  background: #fff;
  margin: 0;
  flex: none;
}

.check input:checked { background: #000; }

.row {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  max-width: 100%;
}

#go {
  background: #000;
  color: #fff;
  border-radius: 0;
  padding: 7px 14px;
  font-size: 11px;
  font-weight: 700;
}

#go:hover { color: #fff; }
#go:disabled { background: #000; color: #fff; opacity: 1; }
</style>
</head>
<body>

<div id="input-view">
  <div id="src" contenteditable="plaintext-only" data-ph="Type here"></div>
  <div class="row">
    <div id="count">0 / 140</div>
    <label class="check"><input type="checkbox" id="special" onchange="fit()"> Special characters</label>
    <button class="btn" id="go" onclick="translateIt()" disabled>Make Latin Poster</button>
  </div>
</div>

<div id="output-view">
  <div id="poster"><div id="latin"></div></div>
  <div class="row">
    <button class="btn" onclick="downloadPng()" aria-label="Download PNG">&#8595;</button>
  </div>
</div>

<script>
const src = document.getElementById('src');
const count = document.getElementById('count');
const go = document.getElementById('go');

src.addEventListener('input', () => {
  let t = src.textContent;
  if (t.length > 140) {
    src.textContent = t.slice(0, 140);
    const r = document.createRange();
    r.selectNodeContents(src);
    r.collapse(false);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    t = src.textContent;
  }
  if (!t.trim()) src.innerHTML = '';
  count.textContent = t.length + ' / 140';
  go.disabled = t.trim().length === 0;
});

src.addEventListener('paste', e => {
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text');
  document.execCommand('insertText', false, t);
});

if (!matchMedia('(hover: none)').matches) src.focus();

function caretToEnd() {
  const r = document.createRange();
  r.selectNodeContents(src);
  r.collapse(false);
  const s = getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

function inputVisible() {
  return document.getElementById('input-view').style.display !== 'none';
}

// clicking/tapping anywhere on the input screen puts the cursor in the text
document.addEventListener('pointerdown', e => {
  if (!inputVisible()) return;
  if (e.target.closest('button, input, label')) return;
  if (e.target === src || src.contains(e.target)) return;
  if (e.pointerType === 'mouse') e.preventDefault();
  src.focus();
  caretToEnd();
});

// typing anywhere on the input screen goes into the text
document.addEventListener('keydown', e => {
  if (!inputVisible()) return;
  if (document.activeElement === src) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length !== 1 && e.key !== 'Backspace') return;
  src.focus();
  caretToEnd();
});

async function translateIt() {
  const text = src.textContent.trim();
  if (!text) return;
  go.disabled = true;
  go.textContent = '...';
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=la&dt=t&q=' + encodeURIComponent(text);
    const res = await fetch(url);
    const data = await res.json();
    const latin = data[0].map(p => p[0]).join('');
    words = latin.trim().split(/\s+/);
    document.getElementById('input-view').style.display = 'none';
    document.getElementById('output-view').style.display = 'flex';
    await document.fonts.ready;
    fit();
  } catch (e) {
    go.textContent = 'Try again';
    go.disabled = false;
    return;
  }
  go.textContent = 'Make Latin Poster';
}

let words = [];
const SETS = ['ss01', 'ss02', 'ss03', 'ss04', 'ss05', 'ss06'];

function fit() {
  const poster = document.getElementById('poster');
  const el = document.getElementById('latin');
  if (!words.length) return;

  const special = document.getElementById('special').checked;
  const maxW = el.clientWidth;
  const maxH = poster.clientHeight - poster.clientHeight * 0.12;
  const REF = 100;

  el.innerHTML = '';
  const nodes = words.map((w, i) => {
    const d = document.createElement('div');
    d.className = 'word';
    d.textContent = w;
    d.style.fontFeatureSettings = special
      ? '"dlig" 1, "liga" 1, "salt" 1, "' + SETS[i % SETS.length] + '" 1'
      : 'normal';
    d.style.fontSize = REF + 'px';
    el.appendChild(d);
    return d;
  });

  // size each word so it spans the full width
  const sizes = nodes.map(d => REF * (maxW / d.scrollWidth));
  sizes.forEach((s, i) => nodes[i].style.fontSize = s + 'px');

  // scale everything down if the stack is taller than the poster
  const total = el.scrollHeight;
  if (total > maxH) {
    const k = maxH / total;
    sizes.forEach((s, i) => nodes[i].style.fontSize = (s * k) + 'px');
  }
}

window.addEventListener('resize', () => {
  if (document.getElementById('output-view').style.display === 'flex') fit();
});

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function downloadPng() {
  const poster = document.getElementById('poster');
  const W = poster.clientWidth, H = poster.clientHeight;
  if (!W || !H) return;

  let fontCss = '';
  for (const sheet of document.styleSheets) {
    let rules;
    try { rules = sheet.cssRules; } catch (e) { continue; }
    for (const rule of rules) {
      if (rule.constructor.name === 'CSSFontFaceRule') fontCss += rule.cssText;
    }
  }

  const pRect = poster.getBoundingClientRect();
  let body = '';
  document.querySelectorAll('#latin .word').forEach(n => {
    const r = n.getBoundingClientRect();
    const cs = getComputedStyle(n);
    const cx = r.left - pRect.left + r.width / 2;
    const cy = r.top - pRect.top + r.height / 2;
    body += '<text x="' + cx + '" y="' + cy + '" font-size="' + parseFloat(cs.fontSize) + '"'
      + ' text-anchor="middle" dominant-baseline="central"'
      + ' style="font-family:cecilia;letter-spacing:' + cs.letterSpacing
      + ';font-feature-settings:' + (cs.fontFeatureSettings || 'normal') + '">'
      + esc(n.textContent) + '</text>';
  });

  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">'
    + '<style>' + fontCss + '</style>'
    + '<rect width="100%" height="100%" fill="#fff"/>' + body + '</svg>';

  const img = new Image();
  img.onload = function () {
    const scale = 1200 / W;
    const c = document.createElement('canvas');
    c.width = Math.round(W * scale);
    c.height = Math.round(H * scale);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL('image/png');

    if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;';
      const im = document.createElement('img');
      im.src = dataUrl;
      im.style.cssText = 'height:' + H + 'px;width:auto;max-width:90vw;display:block;';
      const hint = document.createElement('p');
      hint.textContent = 'Press & hold to save';
      hint.style.cssText = "color:#000;font:700 12px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;padding:12px 0;";
      ov.onclick = function () { document.body.removeChild(ov); };
      ov.appendChild(im);
      ov.appendChild(hint);
      document.body.appendChild(ov);
    } else {
      const a = document.createElement('a');
      a.download = 'latin.png';
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function reset() {
  document.getElementById('output-view').style.display = 'none';
  document.getElementById('input-view').style.display = 'flex';
  src.innerHTML = '';
  count.textContent = '0 / 140';
  go.disabled = true;
  src.focus();
}

src.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) translateIt();
});
</script>

</body>
</html>
