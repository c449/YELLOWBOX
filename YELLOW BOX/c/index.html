<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2H</title>
<meta name="description" content="Pick a number.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://deusaderit.com/c/">
<meta property="og:title" content="H2H">
<meta property="og:description" content="Pick a number.">
<meta property="og:image" content="https://deusaderit.com/c/opengraph.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="H2H">
<meta name="twitter:description" content="Pick a number.">
<meta name="twitter:image" content="https://deusaderit.com/c/opengraph.png">
<style>
  :root { --fg: #fff; --bg: #000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; text-transform: uppercase; font-size: 14px; letter-spacing: .02em; -webkit-user-select: none; user-select: none; }
  #ui { position: fixed; top: 16px; left: 16px; z-index: 10; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  #ui button { font: inherit; color: var(--fg); background: none; border: 0; cursor: pointer; padding: 0; text-transform: uppercase; letter-spacing: inherit; }
  #ui button[hidden], #status:empty, #count[hidden] { display: none; }
  #count { display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: 420px; }
  #count button { font: inherit; color: var(--fg); background: none; border: 0; padding: 2px 0; cursor: pointer; letter-spacing: inherit; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
</style>
</head>
<body>
<div id="ui">
  <div id="status"></div>
  <div id="count"></div>
</div>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  const statusEl = document.getElementById('status');

  // Board coordinates are fractions of the closed square (0..1).
  const TL=[0,0], TR=[1,0], BR=[1,1], BL=[0,1], T=[.5,0], R=[1,.5], B=[.5,1], L=[0,.5], C=[.5,.5];
  // n: number on the flap, q: pocket, pts: [hingeA, hingeB, apex]
  const DEFS = [
    { n:1, q:'bl', pts:[L,BL,C] },
    { n:2, q:'tl', pts:[TL,L,C] },
    { n:3, q:'tl', pts:[TL,T,C] },
    { n:4, q:'tr', pts:[T,TR,C] },
    { n:5, q:'tr', pts:[TR,R,C] },
    { n:6, q:'br', pts:[R,BR,C] },
    { n:7, q:'br', pts:[B,BR,C] },
    { n:8, q:'bl', pts:[BL,B,C] },
  ];
  const SET_V = [3,4,7,8], SET_H = [1,2,5,6], ALL = [1,2,3,4,5,6,7,8];

  let S = 400; // board size in px

  function grow(pts, k) { // push polygon out a hair from its centroid to hide seams
    const cx = pts.reduce((a,p)=>a+p[0],0)/pts.length, cy = pts.reduce((a,p)=>a+p[1],0)/pts.length;
    return pts.map(p => [cx + (p[0]-cx)*(1+k), cy + (p[1]-cy)*(1+k)]);
  }
  const poly = pts => 'polygon(' + pts.map(p => (p[0]*100).toFixed(3)+'% '+(p[1]*100).toFixed(3)+'%').join(',') + ')';
  const toBig = p => [(p[0]+.5)/2, (p[1]+.5)/2]; // board fraction -> fraction of the 2x unfolded sheet

  // WebGL: every piece of paper is a flat polygon cut from one of the photos.
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const DIST = 1800; // camera distance in px, like a CSS perspective
  const camera = new THREE.PerspectiveCamera(45, 1, 1, 10000);
  camera.position.set(0, 0, DIST);
  // show the paper only once every photo has loaded (no black first frame)
  renderer.domElement.style.visibility = 'hidden';
  const manager = new THREE.LoadingManager(() => { renderer.domElement.style.visibility = 'visible'; draw(); });
  const loader = new THREE.TextureLoader(manager);
  const tex = url => {
    const t = loader.load(url, () => draw());
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  };
  const TEX = { inside: tex('inside.jpg?v=4'), front: tex('front.jpg'), back: tex('back.jpg'), pockets: tex('pockets.jpg?v=3') };

  // A face: polygon in fractions of its element (size = S * span), with texture coords.
  // side: FrontSide = one-sided paper face, DoubleSide = pockets.
  function mk(texture, polyFrac, span, uvOf, side) {
    const n = polyFrac.length, tri = [];
    // printed side faces you when the piece keeps its own corner order on screen;
    // WebGL's y axis points up, so pieces listed the other way round get reversed
    let area = 0;
    polyFrac.forEach((p, i) => { const q = polyFrac[(i + 1) % n]; area += p[0]*q[1] - q[0]*p[1]; });
    for (let i = 1; i < n - 1; i++) area > 0 ? tri.push(0, i + 1, i) : tri.push(0, i, i + 1);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(polyFrac.flatMap(p => { const [u, v] = uvOf(p); return [u, 1 - v]; })), 2));
    g.setIndex(tri);
    const mat = new THREE.MeshBasicMaterial({ map: texture, side, transparent: true });
    const mesh = new THREE.Mesh(g, mat);
    mesh.frustumCulled = false;
    scene.add(mesh);
    return { mesh, polyFrac, span };
  }
  const FRONT = THREE.FrontSide, BOTH = THREE.DoubleSide;
  const same = p => p, half = p => [.25 + p[0]/2, .25 + p[1]/2];

  // Layers
  const under = mk(TEX.front, [[0,0],[1,0],[1,1],[0,1]], 1, half, FRONT);
  const mirror = pts => pts.map(p => [1 - p[0], p[1]]);
  const tris = DEFS.map(d => {
    const [a,b,c] = d.pts;
    // apex mirrored over the hinge edge (edges are vertical or horizontal)
    const refl = a[0] === b[0] ? [2*a[0] - c[0], c[1]] : [c[0], 2*a[1] - c[1]];
    const el = mk(TEX.inside, grow(d.pts, .006), 1, same, FRONT);
    // the other side of the same piece of paper (from the back photo)
    const bk = mk(TEX.back, grow(mirror(d.pts), .006), 1, half, FRONT);
    const tip = mk(TEX.front, grow([a,b,refl].map(toBig), .006), 2, same, FRONT);
    return { ...d, el, bk, tip, refl, on: false };
  });
  const back = mk(TEX.back, [[.5,0],[1,.5],[.5,1],[0,.5]], 2, same, FRONT);

  // The finger pockets: a second square of paper behind each quarter, joined to it along
  // the quarter's two outer edges. Its tip is where the finger pushes in.
  // Texture: the pocket squares cut from the closed photo (two real pockets, side by side).
  const POCKETS = [
    { X:'TL', m:['T','L'], tile:0 }, { X:'TR', m:['R','T'], tile:1 },
    { X:'BR', m:['B','R'], tile:0 }, { X:'BL', m:['L','B'], tile:1 },
  ];
  const TIP = [0,0], SIDE_A = [1,0], INNER = [1,1], SIDE_B = [0,1];
  const pockets = POCKETS.flatMap(pk => [0,1].map(f => {
    const u = [TIP, INNER, f ? SIDE_B : SIDE_A];
    const el = mk(TEX.pockets, grow(u, .01), 1, p => [(pk.tile + p[0]) / 2, p[1]], BOTH);
    return { ...pk, f, u, el };
  }));

  // The folded sheet is one piece: all 8 faces share the 9 real paper points.
  const LABELS = [
    ['L','BL','C'], ['TL','L','C'], ['TL','T','C'], ['T','TR','C'],
    ['TR','R','C'], ['R','BR','C'], ['B','BR','C'], ['BL','B','C'],
  ];
  const vertsFrom = pos => LABELS.flatMap(l => l.flatMap(k => pos[k]));

  // Poses, in units of the square, centred on C, z toward the viewer
  const FLAT = {
    TL:[-.5,-.5,0], T:[0,-.5,0], TR:[.5,-.5,0], R:[.5,0,0],
    BR:[.5,.5,0], B:[0,.5,0], BL:[-.5,.5,0], L:[-.5,0,0], C:[0,0,0],
  };
  // Folded shapes, copied from the photos of the real one (positions read off the photos).
  // Open: the pinched corners sit at the two ends of the slit, the open creases at the
  // sides, the shut creases hang down inside the slit, the centre is deep, and each
  // pocket is a big outer face from a slit end out to its peak (K).
  // Closed: the four corners meet in the middle and the pockets lie on top.
  const OPEN_V = { // III IV VII VIII open, slit runs left to right
    C:[0,0,-.42], T:[0,-.32,-.02], B:[0,.32,-.02], L:[-.32,0,-.45], R:[.32,0,-.45],
    TL:[-.5,-.025,0], BL:[-.5,.025,0], TR:[.5,-.025,0], BR:[.5,.025,0],
    KTL:[-.3,-.43,.03], KTR:[.3,-.43,.03], KBR:[.3,.43,.03], KBL:[-.3,.43,.03],
  };
  const OPEN_H = { // II I V VI open, slit runs top to bottom
    C:[0,0,-.42], L:[-.32,0,-.02], R:[.32,0,-.02], T:[0,-.32,-.45], B:[0,.32,-.45],
    TL:[-.025,-.5,0], TR:[.025,-.5,0], BL:[-.025,.5,0], BR:[.025,.5,0],
    KTL:[-.43,-.3,.03], KTR:[.43,-.3,.03], KBR:[.43,.3,.03], KBL:[-.43,.3,.03],
  };
  const CLOSED = {
    C:[0,0,-.45], T:[0,-.36,-.2], R:[.36,0,-.2], B:[0,.36,-.2], L:[-.36,0,-.2],
    TL:[-.02,-.02,.1], TR:[.02,-.02,.1], BR:[.02,.02,.1], BL:[-.02,.02,.1],
    KTL:[-.42,-.42,-.06], KTR:[.42,-.42,-.06], KBR:[.42,.42,-.06], KBL:[-.42,.42,-.06],
  };
  FLAT.KTL = FLAT.KTR = FLAT.KBR = FLAT.KBL = [0,0,-.02]; // pockets tucked behind the flat sheet
  const tipsFrom = pos => ['KTL','KTR','KBR','KBL'].flatMap(k => pos[k]);

  // Animated parameters
  const P = { pk: 0, v: vertsFrom(FLAT), k: tipsFrom(FLAT), op:[1,1,1,1,1,1,1,1], lift:[0,0,0,0,0,0,0,0], tilt:0, scale:1, flip:0, under:0 };

  const rotAround = (m, px, py, ax, ay, deg) => m.translateSelf(px, py, 0).rotateAxisAngleSelf(ax, ay, 0, deg).translateSelf(-px, -py, 0);

  // Pick rotation signs so every lift comes up toward the viewer.
  function signFor(axis, pivot, probe) {
    const m = rotAround(new DOMMatrix(), pivot[0], pivot[1], axis[0], axis[1], 30);
    return m.transformPoint(new DOMPoint(probe[0], probe[1], 0)).z > 0 ? 1 : -1;
  }
  tris.forEach(t => {
    const [a,b,c] = t.pts;
    const cen = [(a[0]+b[0]+c[0])/3, (a[1]+b[1]+c[1])/3];
    t.hingeAxis = [b[0]-a[0], b[1]-a[1]];
    t.liftSign = signFor(t.hingeAxis, a, cen);
  });

  // Affine map that sends the flat triangle (u) onto three 3D points (q). Returns matrix + facing.
  function faceMatrix(u, q) {
    const e1 = [u[1][0]-u[0][0], u[1][1]-u[0][1]], e2 = [u[2][0]-u[0][0], u[2][1]-u[0][1]];
    const E1 = [0,1,2].map(k => q[1][k]-q[0][k]), E2 = [0,1,2].map(k => q[2][k]-q[0][k]);
    let N = [E1[1]*E2[2]-E1[2]*E2[1], E1[2]*E2[0]-E1[0]*E2[2], E1[0]*E2[1]-E1[1]*E2[0]];
    const det = e1[0]*e2[1] - e1[1]*e2[0];
    const nl = (Math.hypot(...N) || 1) * Math.sign(det); N = N.map(x => x/nl); // keep the printed side facing out
    const i00 = e2[1]/det, i01 = -e2[0]/det, i10 = -e1[1]/det, i11 = e1[0]/det; // inverse of [e1 e2]
    const A = [0,1,2].map(r => [E1[r]*i00 + E2[r]*i10, E1[r]*i01 + E2[r]*i11, N[r]]);
    const t = [0,1,2].map(r => q[0][r] - A[r][0]*u[0][0] - A[r][1]*u[0][1]);
    const m = new DOMMatrix([A[0][0],A[1][0],A[2][0],0, A[0][1],A[1][1],A[2][1],0, A[0][2],A[1][2],A[2][2],0, t[0],t[1],t[2],1]);
    return { m, nz: N[2] };
  }

  // Board transform (scale, tilt, flip) about the board centre, as the old CSS did.
  const boardMatrix = () => new DOMMatrix().scaleSelf(P.scale, P.scale, P.scale).rotateSelf(P.tilt, 0, 0).rotateSelf(0, P.flip, 0);
  let RB = new DOMMatrix();
  function place(face, m, visible, opacity = 1) {
    face.mesh.visible = visible && opacity > .01;
    if (!face.mesh.visible) return;
    face.mesh.material.opacity = opacity;
    const pos = face.mesh.geometry.attributes.position, size = S * face.span;
    face.polyFrac.forEach((p, i) => {
      const q = m.transformPoint(new DOMPoint(p[0]*size, p[1]*size, 0));
      const r = RB.transformPoint(new DOMPoint(q.x - S/2, q.y - S/2, q.z));
      pos.setXYZ(i, r.x, -r.y, r.z);
    });
    pos.needsUpdate = true;
  }

  function render() {
    RB = boardMatrix();
    tris.forEach((t, i) => {
      const lift = P.lift[i];
      const u = t.pts.map(p => [p[0]*S, p[1]*S]);
      const q = [0,1,2].map(j => { const o = (i*3 + j)*3; return [(P.v[o]+.5)*S, (P.v[o+1]+.5)*S, P.v[o+2]*S]; });
      const { m } = faceMatrix(u, q);
      const a = t.pts[0];
      // front half of the flap: 0 -> 90
      const mf = DOMMatrix.fromMatrix(m);
      rotAround(mf, a[0]*S, a[1]*S, t.hingeAxis[0], t.hingeAxis[1], t.liftSign * Math.min(lift, 90));
      t.mat = mf;
      place(t.el, mf, lift < 90, P.op[i]);
      // other side of the paper: same place, facing the other way
      place(t.bk, DOMMatrix.fromMatrix(mf).translateSelf(S, 0, 0).scaleSelf(-1, 1, -1), lift === 0 && P.pk >= .5);
      // back of the flap (the name): 90 -> 180
      const mb = DOMMatrix.fromMatrix(m);
      rotAround(mb, a[0]*S, a[1]*S, t.hingeAxis[0], t.hingeAxis[1], t.liftSign * (Math.max(lift, 90) - 180));
      mb.translateSelf(-S/2, -S/2, 0);
      place(t.tip, mb, lift > 90);
    });
    // pockets
    const named = {};
    LABELS.forEach((l, i) => l.forEach((k, j) => { const o = (i*3 + j)*3; named[k] = [P.v[o], P.v[o+1], P.v[o+2]]; }));
    pockets.forEach((pk, j) => {
      const X = named[pk.X], M1 = named[pk.m[0]], M2 = named[pk.m[1]];
      const o = Math.floor(j/2)*3, K = [P.k[o], P.k[o+1], P.k[o+2]];
      const q = [K, X, pk.f ? M2 : M1].map(p => [(p[0]+.5)*S, (p[1]+.5)*S, p[2]*S]);
      const { m } = faceMatrix(pk.u.map(p => [p[0]*S, p[1]*S]), q);
      pk.mat = m;
      place(pk.el, m, true, Math.max(0, P.pk));
    });
    // the paper under the flaps
    place(under, new DOMMatrix().translateSelf(0, 0, -0.5), true, P.under);
    // back of the whole unfolded sheet
    place(back, new DOMMatrix().translateSelf(S/2, S/2, 0).rotateSelf(0, 180, 0).translateSelf(-S, -S, 0), true);
    draw();
  }
  function draw() { renderer.render(scene, camera); }

  // Tweening
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  function tween(to, ms) {
    const from = JSON.parse(JSON.stringify(P));
    return new Promise(res => {
      const t0 = performance.now();
      function step(now) {
        const k = Math.min(1, (now - t0) / ms), e = ease(k);
        for (const key in to) {
          if (Array.isArray(to[key])) P[key] = to[key].map((v, i) => from[key][i] + (v - from[key][i]) * e);
          else P[key] = from[key] + (to[key] - from[key]) * e;
        }
        render();
        k < 1 ? requestAnimationFrame(step) : res();
      }
      requestAnimationFrame(step);
    });
  }

  // Poses
  const TILT = 12;
  const openPose = set => ({
    v: vertsFrom(set === SET_V ? OPEN_V : OPEN_H), k: tipsFrom(set === SET_V ? OPEN_V : OPEN_H),
    op: DEFS.map(() => 1),
    lift: [0,0,0,0,0,0,0,0], tilt: TILT, scale: 1, under: 0, pk: 1,
  });
  const closedPose = () => ({ pk: 1, v: vertsFrom(CLOSED), k: tipsFrom(CLOSED), op: DEFS.map(() => 1), tilt: TILT, scale: 1 });
  const flatPose = () => ({ pk: 0, v: vertsFrom(FLAT), k: tipsFrom(FLAT), op: DEFS.map(() => 1), tilt: 0, under: 1 });

  let state = 'busy', current = SET_V, unfolded = false;
  const form = document.getElementById('count');
  for (let i = 1; i <= 21; i++) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = i;
    b.addEventListener('click', () => { if (state === 'enter') play(i); });
    form.appendChild(b);
  }

  function setClickable(set) {
    tris.forEach(t => { t.on = !!set && set.includes(t.n); });
  }
  function showEntry() {
    statusEl.textContent = 'PICK A NUMBER'; form.hidden = false; state = 'enter';
  }

  // Closed, waiting for a number.
  async function toClosed() {
    state = 'busy'; setClickable(null);
    await tween({ ...closedPose(), lift: [0,0,0,0,0,0,0,0], under: 0 }, 650);
    showEntry();
  }

  // Open and close once per count, switching direction each time, then open and stay open.
  async function play(times) {
    state = 'busy'; form.hidden = true; statusEl.textContent = '';
    const fast = times > 5;
    for (let i = 0; i < times; i++) {
      await tween(openPose(i % 2 ? SET_H : SET_V), fast ? 130 : 300);
      await tween(closedPose(), fast ? 110 : 260);
    }
    current = times % 2 ? SET_H : SET_V;
    await tween(openPose(current), 420);
    setClickable(current); state = 'pick';
    statusEl.textContent = 'PICK A NUMBER';
  }

  // The chosen flap opens.
  async function reveal(n) {
    state = 'busy'; setClickable(null); statusEl.textContent = '';
    await tween({ pk: 0 }, 220);
    await tween({ ...flatPose(), scale: 1 }, 700);
    await tween({ lift: DEFS.map(d => d.n === n ? 180 : 0) }, 1100);
    state = 'done';
  }

  async function closeReveal() {
    state = 'busy';
    await tween({ lift: [0,0,0,0,0,0,0,0] }, 800);
    toClosed();
  }


  // Project a face's corners to the screen (same math as the CSS) and test the click against them.
  function screenPts(t) {
    const W = innerWidth, H = innerHeight, Rb = boardMatrix();
    return t.pts.map(p => {
      const q = t.mat.transformPoint(new DOMPoint(p[0]*S, p[1]*S, 0));
      const r = Rb.transformPoint(new DOMPoint(q.x - S/2, q.y - S/2, q.z));
      const k = DIST / (DIST - r.z);
      return [W/2 + r.x*k, H/2 + r.y*k, r.z];
    });
  }
  function inside(px, py, [a,b,c]) {
    const s = (p, q, r) => (p[0]-r[0])*(q[1]-r[1]) - (q[0]-r[0])*(p[1]-r[1]);
    const d1 = s([px,py],a,b), d2 = s([px,py],b,c), d3 = s([px,py],c,a);
    return !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0));
  }
  function hit(x, y) {
    let best = null, bestZ = -Infinity;
    if (P.pk > .5) pockets.forEach(pk => {
      if (!pk.mat) return;
      const sp = screenPts({ mat: pk.mat, pts: pk.u });
      const z = (sp[0][2]+sp[1][2]+sp[2][2])/3;
      if (inside(x, y, sp) && z > bestZ) { best = null; bestZ = z; }
    });
    tris.forEach(t => {
      if (!t.on || !t.mat) return;
      const sp = screenPts(t);
      // only faces whose printed side is turned toward you
      const cross = (sp[1][0]-sp[0][0])*(sp[2][1]-sp[0][1]) - (sp[1][1]-sp[0][1])*(sp[2][0]-sp[0][0]);
      const [a,b,c] = t.pts, src = (b[0]-a[0])*(c[1]-a[1]) - (b[1]-a[1])*(c[0]-a[0]);
      if (Math.sign(cross) !== Math.sign(src) || Math.abs(cross) < 40) return;
      const z = (sp[0][2]+sp[1][2]+sp[2][2])/3;
      if (inside(x, y, sp) && z > bestZ) { best = t; bestZ = z; }
    });
    return best;
  }

  document.getElementById('stage').addEventListener('click', e => {
    if (state === 'done') { closeReveal(); return; }
    if (state !== 'pick') return;
    const t = hit(e.clientX, e.clientY);
    if (t) reveal(t.n);
  });
  document.getElementById('stage').addEventListener('mousemove', e => {
    document.getElementById('stage').style.cursor = state === 'pick' && hit(e.clientX, e.clientY) ? 'pointer' : '';
  });

  function size() {
    S = Math.round(Math.min(window.innerWidth * 0.46, window.innerHeight * 0.44, 560)); // same size folded or flat
    renderer.setSize(innerWidth, innerHeight);
    camera.aspect = innerWidth / innerHeight;
    camera.fov = 2 * Math.atan(innerHeight / 2 / DIST) * 180 / Math.PI; // 1 px = 1 px at the paper
    camera.updateProjectionMatrix();
    render();
  }
  window.addEventListener('resize', size);
  size();
  Object.assign(P, closedPose(), { under: 0 });
  render();
  showEntry();
})();
</script>
</body>
</html>
