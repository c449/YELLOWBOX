  const N=Math.max(24,Math.round((w+h)/45)),per=2*(w+h),pts=[];
  for(let i=0;i<N;i++){const d=i/N*per;let px,py,nx,ny;
    if(d<w){px=d;py=0;nx=0;ny=1;}else if(d<w+h){px=w;py=d-w;nx=-1;ny=0;}else if(d<2*w+h){px=w-(d-w-h);py=h;nx=0;ny=-1;}else{px=0;py=h-(d-2*w-h);nx=1;ny=0;}
    const e=m*(.15+rnd()*(rnd()<.2?2.2:.8));pts.push([px+nx*e,py+ny*e]);}
  // rounded loss line through the midpoints
  ctx.beginPath();const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s0=mid(pts[N-1],pts[0]);ctx.moveTo(s0[0],s0[1]);
  for(let i=0;i<N;i++){const p=pts[i],q=mid(p,pts[(i+1)%N]);ctx.quadraticCurveTo(p[0],p[1],q[0],q[1]);}
  ctx.closePath();
}
function age(S){

    for(let k=0;k<12;k++){a+=(rnd()-.5)*.9;x+=Math.cos(a)*14;y+=Math.sin(a)*14;ctx.lineTo(x,y);}ctx.stroke();}
  ctx.restore();
}
function tinted(n,dw,dh,crop){
  const im=IMGS[n];const off=mk(dw,dh),oc=off.getContext('2d');
  if(!im){oc.fillStyle=C.plaster;oc.fillRect(0,0,off.width,off.height);return off;}
  let sx=0,sy=0,sw=im.naturalWidth,sh=im.naturalHeight;
  if(crop){sx=crop[0]*sw;sy=crop[1]*sh;sw=(crop[2]-crop[0])*sw;sh=(crop[3]-crop[1])*sh;}
  oc.drawImage(im,sx,sy,sw,sh,0,0,off.width,off.height);

}
function srcSize(n,crop){const im=IMGS[n];let w=im?im.naturalWidth:900,h=im?im.naturalHeight:1200;if(crop){w*=crop[2]-crop[0];h*=crop[3]-crop[1];}return[w,h];}

  if(o.cover){const c0=crop||[0,0,1,1],[sw0,sh0]=srcSize(n,c0),want=iw/ih,have=sw0/sh0;
    if(have>want){const k=want/have,cw=c0[2]-c0[0],pad=cw*(1-k)/2;crop=[c0[0]+pad,c0[1],c0[2]-pad,c0[3]];}
    else{const k=have/want,ch=c0[3]-c0[1],pad=ch*(1-k)*(o.top?0:.5);crop=[c0[0],c0[1]+pad,c0[2],c0[1]+pad+ch*k];}}

/* ---------- geometry ---------- */
function grid(nu,nv,fn){
  const pos=[],uv=[],idx=[];
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const p=fn(i/nu,j/nv);pos.push(p[0],p[1],p[2]);uv.push(p.length>3?p[3]:i/nu,p.length>3?p[4]:j/nv);}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,b,d,a,d,c);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();return g;
}
// horseshoe arch: a circle carried past its diameter by `ext` radians on each side
function hsPath(s,r,cy,ext){const xj=r*Math.cos(ext),hj=cy-r*Math.sin(ext);s.lineTo(-xj,0);s.lineTo(-xj,hj);s.absarc(0,cy,r,PI+ext,-ext,true);s.lineTo(xj,0);}

  if(d<hj)return[-xj,d];if(d<hj+arc){const a=PI+ext-(d-hj)/r;return[r*Math.cos(a),cy+r*Math.sin(a)];}return[xj,hj-(d-hj-arc)];}

/* ---------- two columns at the chancel arch, cut from the same stone as the walls ---------- */
function roughStone(w,h,ppm){
  const S=surface(w*ppm,h*ppm),ctx=S.ctx;ctx.fillStyle='#8c857a';ctx.fillRect(0,0,S.W,S.H);
  for(let i=0;i<S.W*S.H/5000+6;i++){const r=(.04+rnd()*.3)*ppm,px=rnd()*S.W,py=rnd()*S.H,g=ctx.createRadialGradient(px,py,0,px,py,r),a=.05+rnd()*.14,c=rnd()<.5?'52,48,42':rnd()<.5?'150,128,104':'200,194,182';
    g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.fillRect(px-r,py-r,2*r,2*r);}

  ctx.save();ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.6;ctx.fillStyle=ctx.createPattern(noise(),'repeat');ctx.fillRect(0,0,S.W,S.H);ctx.restore();
  return S;
}
// a groove cut by hand: dark bed, light upper lip, wobbling line
function cut(ctx,lw,pts){
  const j=()=>(rnd()-.5)*lw*.5,q=pts.map(p=>[p[0]+j(),p[1]+j()]);
  const path=()=>{ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));};
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  ctx.translate(-lw*.3,-lw*.4);path();ctx.strokeStyle='rgba(205,198,186,.45)';ctx.lineWidth=lw;ctx.stroke();
  ctx.translate(lw*.3,lw*.4);path();ctx.strokeStyle='rgba(34,30,26,.6)';ctx.lineWidth=lw*.75;ctx.stroke();ctx.restore();
}
// capital: two rows of stiff leaves and corner hooks, roughly cut
function roughCapTex(){
  const S=roughStone(1.6,.4,560),ctx=S.ctx,fw=S.W/4,h=S.H,lw=h*.035;
  const leaf=(cx,b,t,w)=>{cut(ctx,lw,[[cx-w,b],[cx-w*.9,b-(b-t)*.6],[cx,t],[cx+w*.9,b-(b-t)*.6],[cx+w,b]]);cut(ctx,lw*.7,[[cx,b],[cx,t+(b-t)*.25]]);};
  for(let f=0;f<4;f++){const x=f*fw;
    for(const k of[0,1,2])leaf(x+fw*(.2+k*.3),h*.94,h*.48,fw*.12);
    for(const k of[0,1])leaf(x+fw*(.35+k*.3),h*.6,h*.2,fw*.1);
    for(const e of[0,1]){const cx=x+e*fw,cy=h*.16,r=h*.09,pts=[];for(let a=0;a<PI*2.2;a+=.4){const rr=r*(1-a/(PI*2.6));pts.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}cut(ctx,lw,pts);}
    cut(ctx,lw*.8,[[x+fw*.12,h*.06],[x+fw*.88,h*.06]]);}
  return S;
}
function chancelColumns(){
  // each column sits in the corner where the arch steps in, half buried in the masonry
  const A=G.arch,xo=A.ro*Math.cos(A.ext),xi=A.ri*Math.cos(A.ext),hj=A.cy-A.ro*Math.sin(A.ext),r0=.1,z=A.zs+r0+.01;
  const shM=new THREE.MeshLambertMaterial({map:tex(roughStone(.8,1.2,320),[1,1])});
  const capM=new THREE.MeshLambertMaterial({map:tex(roughCapTex())});
  const blkM=new THREE.MeshLambertMaterial({map:tex(roughStone(.6,.6,300),[1,1])});
  const bH=.16,iH=.13,cH=.24,sTop=hj-iH-cH;
  for(const s of[-1,1]){const x=s*(xo-r0-.01),ph=rnd()*6;
    let m=add(new THREE.BoxGeometry(.28,bH,.28),blkM);m.position.set(x+s*.03,bH/2,z-.03);
    // monolithic shaft, not quite round and not quite straight
    m=add(grid(24,10,(u,v)=>{const a=u*PI*2,r=r0*(1-.05*v)*(1+.045*Math.sin(3*a+ph)+.025*Math.sin(7*a+ph*2)+.02*Math.sin(v*9+ph));
      return[Math.cos(a)*r+.01*Math.sin(v*3+ph),bH+v*(sTop-bH),Math.sin(a)*r,u*1.5,v*(sTop-bH)/1.2*1.5];}),shM);m.position.set(x,0,z);
    // capital: round at the neck, square at the top, lumpy
    m=add(grid(32,6,(u,v)=>{const a=u*PI*2+PI/4,e=v*v*(3-2*v),hs=.15,rs=hs/Math.max(Math.abs(Math.cos(a)),Math.abs(Math.sin(a))),r=(r0+(rs-r0)*e)*(1+.03*Math.sin(5*a+ph));
      return[Math.cos(a)*r,sTop+v*cH,Math.sin(a)*r,u,v];}),capM);m.position.set(x,0,z);
    // impost: one slab run through the jamb, from the nave face to the inner order, where the arch springs
    const x0=xi-.03,x1=xo+.2,z0=A.z0+.05,z1=A.zs-.07;
    m=add(new THREE.BoxGeometry(x1-x0,iH,z0-z1),blkM);m.position.set(s*(x0+x1)/2,hj-iH/2,(z0+z1)/2);
  }
}

  /* nave */

  const south=sideWall({upper:['6705','win','6740','6738','win','6780'],lower:['6772','6775','6782','6700','6701','6766']});
  let m=add(new THREE.PlaneGeometry(L,Hw),mat(north),north);m.rotation.y=PI/2;m.position.set(-nw,Hw/2,-L/2);
  m=add(new THREE.PlaneGeometry(L,Hw),mat(south),south);m.rotation.y=-PI/2;m.position.set(nw,Hw/2,-L/2);
  const V=vault();

  const FT=tile({lo:108,hi:148,scale:1.1,mortar:'#86817a'});

  if(CROSS){const cols=16,rows=13,t=tex(CROSS);t.repeat.set(1/cols,1/rows);t.generateMipmaps=false;t.minFilter=THREE.LinearFilter;
    const h=2.4,m=add(new THREE.PlaneGeometry(h*170/200,h),new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
    m.position.set(0,1.65,-L/2);cross={m,t,cols,rows,n:195,y:1.65};}

  /* slit windows and their light */
  const wmat=new THREE.MeshBasicMaterial({color:'#fffaf0',side:DS});
  const slitGeo=(w,h)=>{const s=new THREE.Shape(),r=w/2;s.moveTo(-r,0);s.lineTo(-r,h-r);s.absarc(0,h-r,r,PI,0,true);s.lineTo(r,0);s.lineTo(-r,0);return new THREE.ShapeGeometry(s,16);};
  const beams=[];
  const addWin=(pos,rotY,w,h,target)=>{
    const g=add(slitGeo(w,h),wmat);g.position.copy(pos);g.rotation.y=rotY;
    const top=pos.clone().add(new THREE.Vector3(0,h*.6,0));beams.push({from:top,to:target});
    const sp=new THREE.SpotLight('#fff6e6',1.8,14,.28,.7,1.2);sp.position.copy(top.clone().add(top.clone().sub(target).setLength(1.5)));sp.target.position.copy(target);scene.add(sp);scene.add(sp.target);
  };
  south.windows.forEach(xm=>addWin(new THREE.Vector3(nw-.012,2.2,-L+xm),-PI/2,.14,1.05,new THREE.Vector3(-.7,0,-L+xm+1.0)));
  // daylight through the open door
  {const sp=new THREE.SpotLight('#fffaf0',1.6,18,.3,.6,1);sp.position.set(0,2.4,4);sp.target.position.set(0,0,-4);scene.add(sp);scene.add(sp.target);}

  const ext=k=>new THREE.MeshBasicMaterial({map:tex(T,[1/1.6,1/1.6]),color:new THREE.Color(k,k,k)});

    const h=new THREE.Path();h.moveTo(-.3,6.35);h.lineTo(.3,6.35);h.lineTo(.3,7.05);h.absarc(0,7.05,.3,0,PI,false);h.lineTo(-.3,6.35);s.holes.push(h);

  const sideLen=O.front-A.z1+0,sideZ=(0+A.z1)/2;

  {const s=new THREE.Shape();s.moveTo(-O.hw,0);hsPath(s,A.ro,A.cy,A.ext);s.lineTo(O.hw,0);s.lineTo(O.hw,O.wallTop);s.lineTo(0,O.ridge);s.lineTo(-O.hw,O.wallTop);s.lineTo(-O.hw,0);
    m=add(shapeGeo(s,0,0,1.6,1.6),extW(.62));m.rotation.y=PI;m.position.z=-11.6;}
  // apse block
  const al2=A.z1-O.apBack;
  m=add(new THREE.PlaneGeometry(al2,O.apTop),extW(1));m.material.map.repeat.set(al2/1.6,O.apTop/1.6);m.rotation.y=PI/2;m.position.set(O.apHw,O.apTop/2,(A.z1+O.apBack)/2);
  m=add(new THREE.PlaneGeometry(al2,O.apTop),extW(.55));m.material.map.repeat.set(al2/1.6,O.apTop/1.6);m.rotation.y=-PI/2;m.position.set(-O.apHw,O.apTop/2,(A.z1+O.apBack)/2);
  {const s=new THREE.Shape();s.moveTo(-O.apHw,0);s.lineTo(O.apHw,0);s.lineTo(O.apHw,O.apTop);s.lineTo(0,O.apRidge);s.lineTo(-O.apHw,O.apTop);s.lineTo(-O.apHw,0);

  // roofs of stone slabs

/* ---------- movement ---------- */
const STATIONS={outside:{x:8.5,z:9,yaw:.6,pitch:.13},door:{x:0,z:-.8,yaw:0,pitch:.05},north:{x:1.3,z:-5.5,yaw:PI/2,pitch:.1},south:{x:-1.3,z:-5.5,yaw:-PI/2,pitch:.1},apse:{x:0,z:-9.3,yaw:0,pitch:.1},vault:{x:0,z:-5.5,yaw:0,pitch:1.3}};
const cam=Object.assign({y:1.6},STATIONS.outside);
function inBuilding(x,z){return(Math.abs(x)<G.out.hw+.35&&z<G.out.front+.35&&z>G.arch.z1)||(Math.abs(x)<G.out.apHw+.35&&z<=G.arch.z1&&z>G.out.apBack-.35);}
function allowed(x,z){
  if(Math.abs(x)<=2.0&&z<=-.35&&z>=-10.7)return Math.hypot(x,z+G.L/2)>.55;   // nave, around the floating cross
  if(Math.abs(x)<=.7&&z<-10.7&&z>=-11.95)return true;             // under the arch
  if(Math.abs(x)<=1.05&&z<-11.95&&z>=G.altarZ+.55)return true;    // apse
  if(Math.abs(x)<=.45&&z>-.36&&z<=G.out.front+.4)return true;     // doorway
  return !inBuilding(x,z)&&x*x+(z+6)*(z+6)<35*35;                 // outside
}
function move(dx,dz){if(allowed(cam.x+dx,cam.z+dz)){cam.x+=dx;cam.z+=dz;}else if(allowed(cam.x+dx,cam.z))cam.x+=dx;else if(allowed(cam.x,cam.z+dz))cam.z+=dz;}
const keys={};let tween=null;
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  keys[e.code]=true;if(/Arrow|Key[WASD]/.test(e.code)){e.preventDefault();tween=null;}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
// scroll walks: up/down moves forward/back, sideways scroll steps left/right; it eases out after the wheel stops
let wv=0,ws=0;
stage.addEventListener('wheel',e=>{e.preventDefault();tween=null;const k=e.deltaMode===1?16:e.deltaMode===2?400:1,c=v=>Math.max(-5,Math.min(5,v));
  wv=c(wv-e.deltaY*k*.02);ws=c(ws+e.deltaX*k*.02);},{passive:false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
const padState={};
document.querySelectorAll('[data-mv]').forEach(b=>{
  const on=e=>{e.preventDefault();padState[b.dataset.mv]=true;tween=null;},off=()=>{padState[b.dataset.mv]=false;};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
});
let drag=null;
stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now(),id:e.pointerId};stage.setPointerCapture(e.pointerId);});
stage.addEventListener('pointermove',e=>{
  if(drag&&drag.id===e.pointerId){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5){stage.classList.add('dragging');tween=null;cam.yaw+=dx*.0042;cam.pitch=Math.max(-1.2,Math.min(1.45,cam.pitch+dy*.0042));}
  }
});
const endDrag=()=>{if(!drag)return;drag=null;stage.classList.remove('dragging');};
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
/* ---------- song ---------- */
// Salve regina from 2:34; the video stays off screen, the button plays and pauses it
let song=null,playing=false;
$('#play').addEventListener('click',()=>{
  playing=!playing;$('#play').setAttribute('aria-pressed',playing);$('#play').setAttribute('aria-label',playing?'Pause music':'Play music');
  if(!song){song=document.createElement('iframe');song.title='Salve regina';song.allow='autoplay; encrypted-media';song.tabIndex=-1;
    song.src='https://www.youtube-nocookie.com/embed/VmxdXzQeJ7c?start=154&autoplay=1&enablejsapi=1&rel=0&controls=0';$('#player').appendChild(song);return;}
  song.contentWindow.postMessage(JSON.stringify({event:'command',func:playing?'playVideo':'pauseVideo',args:[]}),'*');
});

/* ---------- loop ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?78:64;camera.updateProjectionMatrix();}
addEventListener('resize',resize);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;const T=now/1000;
  if(tween){tween.t+=dt/tween.d;const k=ease(Math.min(1,tween.t));for(const p of['x','z','yaw','pitch'])cam[p]=tween.from[p]+(tween.to[p]-tween.from[p])*k;if(tween.t>=1)tween=null;}
  const sp=(keys.ShiftLeft||keys.ShiftRight?3.6:2.0)*dt;let f=0,s=0;
  if(keys.KeyW||keys.ArrowUp||padState.f)f+=1;if(keys.KeyS||keys.ArrowDown||padState.b)f-=1;
  if(keys.KeyD||padState.r)s+=1;if(keys.KeyA||padState.l)s-=1;
  if(keys.ArrowLeft)cam.yaw+=1.6*dt;if(keys.ArrowRight)cam.yaw-=1.6*dt;
  if(f||s){const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);move((fx*f+rx*s)*sp,(fz*f+rz*s)*sp);}
  if(Math.abs(wv)>.01||Math.abs(ws)>.01){const fx=-Math.sin(cam.yaw),fz=-Math.cos(cam.yaw),rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);move((fx*wv+rx*ws)*dt,(fz*wv+rz*ws)*dt);const d=Math.exp(-dt*6);wv*=d;ws*=d;}else{wv=ws=0;}
  const ty=1.6+(cam.z<G.ap.z0&&Math.abs(cam.x)<1.4?G.step:0);cam.y+=(ty-cam.y)*Math.min(1,dt*8);
  const bob=(f||s)?Math.sin(T*9)*.012:0;
  camera.position.set(cam.x,cam.y+bob,cam.z);camera.rotation.set(cam.pitch,cam.yaw,0);
  lantern.position.set(cam.x,cam.y+.3,cam.z);
  if(cross){const i=Math.floor(T*25)%cross.n;cross.t.offset.set((i%cross.cols)/cross.cols,1-(Math.floor(i/cross.cols)+1)/cross.rows);
    cross.m.position.y=cross.y+Math.sin(T*.7)*.06;cross.m.rotation.y=Math.atan2(cam.x-cross.m.position.x,cam.z-cross.m.position.z);}
  for(const c of candles){if(!c)continue;const fl=.82+.1*Math.sin(T*7.3+c.ph)+.06*Math.sin(T*13.1+c.ph*2)+.04*Math.sin(T*23+c.ph);c.pl.intensity=1.1*fl;c.sp.scale.set(.09*fl,.16*(.9+.2*fl),1);c.halo.material.opacity=.2*fl;}
  for(const b of beamMeshes)b.material.uniforms.t.value=T;
  if(dust){const a=dust.pts.geometry.attributes.position;for(let i=0;i<a.count;i++){const p=dust.base[i*2],ph=dust.base[i*2+1];a.setXYZ(i,p.x+Math.sin(T*.13+ph)*.1,p.y+Math.sin(T*.09+ph*1.7)*.15,p.z+Math.cos(T*.11+ph)*.1);}a.needsUpdate=true;}
  renderer.render(scene,camera);requestAnimationFrame(frame);
}

const fontReady=document.fonts?Promise.race([document.fonts.load('80px "cecilia"'),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
Promise.all([load(),fontReady]).then(()=>{setTimeout(()=>{
  build();
  resize();requestAnimationFrame(t=>{last=t;frame(t);});
  $('#loader').classList.add('done');setTimeout(()=>$('#loader').hidden=true,1100);
},30);});
})();
