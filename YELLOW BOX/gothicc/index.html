    width:100vw;min-height:100vh;
    padding:5vh 4vw;
    caret-color:#111;word-break:break-word;overflow-wrap:anywhere;
    white-space:pre-wrap;
  }
  .paper:empty::before{
    content:'type here';
    color:#d2d2d2;text-transform:uppercase;pointer-events:none;
  }
  .paper img.x{
    height:0.86em;width:auto;
    vertical-align:-0.10em;
    margin:0 .02em;
    user-select:none;-webkit-user-drag:none;
  }
</style>
</head>
<body>
  <div id="p" class="paper" contenteditable="true" spellcheck="false" autofocus></div>
<script>
  // keep focus friendly on load
  window.addEventListener('load',function(){document.getElementById('p').focus();});

  // ── every T becomes a random crucifix ──
  var P=document.getElementById('p'), N=17;

  // preload so they appear instantly
  for(var i=1;i<=N;i++){ var pre=new Image(); pre.src=src(i); }

  function src(i){ return 'crosses/c'+('0'+i).slice(-2)+'.png'; }

  function cross(){
    var img=document.createElement('img');
    img.src=src(1+Math.floor(Math.random()*N));
    img.alt='T';                       // so copied text still reads T
    img.className='x';
    img.draggable=false;
    var s=getSelection(); if(!s.rangeCount) return;
    var r=s.getRangeAt(0);
    r.deleteContents(); r.insertNode(img);
    r.setStartAfter(img); r.collapse(true);
    s.removeAllRanges(); s.addRange(r);
  }

  P.addEventListener('beforeinput',function(e){
    if(e.inputType==='insertText' && e.data && /t/i.test(e.data)){
      e.preventDefault();
      for(var i=0;i<e.data.length;i++){
        var ch=e.data[i];
        if(/t/i.test(ch)) cross();
        else document.execCommand('insertText',false,ch);
      }
    }
  });

  P.addEventListener('paste',function(e){
    e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData('text');
    for(var i=0;i<t.length;i++){
      if(/t/i.test(t[i])) cross();
      else document.execCommand('insertText',false,t[i]);
    }
  });
</script>
</body>
</html>
