<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE ANOMALY</title>
<meta property="og:type" content="website">
<meta property="og:url" content="https://deusaderit.com/anomaly/">
<meta property="og:title" content="THE ANOMALY">
<link rel="icon" href="/favicon.png">
<style>
  @font-face { font-family: "Cecilia"; src: url("cecilia-Regular.otf") format("opentype"); font-display: block; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: #fff; overflow: hidden; }
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; text-transform: uppercase; }
  #stage { position: fixed; }
  #stage img, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #stage canvas { touch-action: none; }
  canvas.grab { cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  h1 { position: fixed; top: 24px; left: 24px; font-family: "Cecilia", serif; font-weight: 400; text-transform: none; font-size: clamp(32px, 6vw, 72px); line-height: 1; pointer-events: none; }
  nav { position: fixed; left: 24px; bottom: 24px; display: flex; gap: 24px; }
  button { background: none; border: 0; color: #fff; font: inherit; font-size: 15px; letter-spacing: 0.04em; cursor: pointer; padding: 0; }
  button:disabled { opacity: 0; pointer-events: none; }
  input { display: none; }
  @media (max-width: 600px) { h1 { top: 16px; left: 16px; } nav { left: 16px; bottom: 16px; } }
</style>
</head>
<body>
<div id="stage">
  <img id="photo" src="anomaly.png" alt="">
  <canvas id="c"></canvas>
</div>
<h1>THE ANOMALY</h1>
<nav>
  <button id="add" disabled>ADD IMAGE</button>
  <button id="save" disabled>SAVE</button>
</nav>
<input id="file" type="file" accept="image/*">
<script>
const stage = document.getElementById('stage');
const photo = document.getElementById('photo');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let PW, PH, MW, MH, mask, box, img = null;
let view = { s: 1, x: 0, y: 0 };

// fit the photo on screen, whole, never cropped
function layout() {
  if (!PW) return;
  const k = Math.min(innerWidth / PW, innerHeight / PH);
  const w = PW * k, h = PH * k;
  Object.assign(stage.style, { width: w + 'px', height: h + 'px', left: '0px', top: (innerHeight - h) / 2 + 'px' });
}

// find the white inside of the anomaly in the photo
function buildMask() {
  PW = photo.naturalWidth; PH = photo.naturalHeight;
  const k = 2400 / PW;
  MW = Math.round(PW * k); MH = Math.round(PH * k);
  cv.width = MW; cv.height = MH;
  const t = document.createElement('canvas'); t.width = MW; t.height = MH;
  const tc = t.getContext('2d');
  tc.drawImage(photo, 0, 0, MW, MH);
  const d = tc.getImageData(0, 0, MW, MH).data;
  const n = MW * MH, lo = 120, hi = 190;
  const soft = new Float32Array(n), on = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const v = Math.min(d[i * 4], d[i * 4 + 1]);
    const a = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
    soft[i] = a * a * (3 - 2 * a);
    on[i] = v > (lo + hi) / 2 ? 1 : 0;
  }
  // keep only the biggest bright area (drops the stars)
  const lab = new Int32Array(n); let best = 0, bestSize = 0, id = 0;
  const st = new Int32Array(n);
  for (let s = 0; s < n; s++) {
    if (!on[s] || lab[s]) continue;
    id++; let sp = 0, size = 0; st[sp++] = s; lab[s] = id;
    while (sp) {
      const p = st[--sp]; size++;
      const x = p % MW, y = (p / MW) | 0;
      if (x > 0 && on[p - 1] && !lab[p - 1]) { lab[p - 1] = id; st[sp++] = p - 1; }
      if (x < MW - 1 && on[p + 1] && !lab[p + 1]) { lab[p + 1] = id; st[sp++] = p + 1; }
      if (y > 0 && on[p - MW] && !lab[p - MW]) { lab[p - MW] = id; st[sp++] = p - MW; }
      if (y < MH - 1 && on[p + MW] && !lab[p + MW]) { lab[p + MW] = id; st[sp++] = p + MW; }
    }
    if (size > bestSize) { bestSize = size; best = id; }
  }
  // grow the area a little so the soft edge is kept
  const keep = new Uint8Array(n); let minx = MW, miny = MH, maxx = 0, maxy = 0;
  for (let i = 0; i < n; i++) if (lab[i] === best) { keep[i] = 1; const x = i % MW, y = (i / MW) | 0; if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y; }
  const R = Math.round(MW / 300);
  for (let pass = 0; pass < R; pass++) {
    const prev = keep.slice();
    for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
      const i = y * MW + x;
      if (!prev[i] && (prev[i - 1] || prev[i + 1] || prev[i - MW] || prev[i + MW])) keep[i] = 1;
    }
  }
  const md = new ImageData(MW, MH);
  for (let i = 0; i < n; i++) { md.data[i * 4 + 3] = keep[i] ? Math.round(soft[i] * 255) : 0; }
  mask = document.createElement('canvas'); mask.width = MW; mask.height = MH;
  mask.getContext('2d').putImageData(md, 0, 0);
  box = { x: minx, y: miny, w: maxx - minx, h: maxy - miny };
  layout();
  document.getElementById('add').disabled = false;
}

function render(c, w, h) {
  const f = w / MW;
  c.clearRect(0, 0, w, h);
  if (!img) return;
  const k = Math.max(box.w / img.width, box.h / img.height) * view.s;
  const x = box.x + box.w / 2 - img.width * k / 2 + view.x;
  const y = box.y + box.h / 2 - img.height * k / 2 + view.y;
  c.globalCompositeOperation = 'source-over';
  c.drawImage(img, x * f, y * f, img.width * k * f, img.height * k * f);
  c.globalCompositeOperation = 'destination-in';
  c.drawImage(mask, 0, 0, w, h);
  c.globalCompositeOperation = 'source-over';
}
const draw = () => render(ctx, MW, MH);

function load(file) {
  if (!file || !file.type.startsWith('image/') || !mask) return;
  const im = new Image();
  im.onload = () => { img = im; view = { s: 1, x: 0, y: 0 }; cv.className = 'grab'; document.getElementById('save').disabled = false; draw(); };
  im.src = URL.createObjectURL(file);
}

const fileIn = document.getElementById('file');
document.getElementById('add').onclick = () => fileIn.click();
fileIn.onchange = () => { load(fileIn.files[0]); fileIn.value = ''; };
document.getElementById('save').onclick = () => {
  const out = (w, h) => {
    const o = document.createElement('canvas'); o.width = w; o.height = h;
    const oc = o.getContext('2d');
    const layer = document.createElement('canvas'); layer.width = w; layer.height = h;
    render(layer.getContext('2d'), w, h);
    oc.drawImage(photo, 0, 0, w, h);
    oc.drawImage(layer, 0, 0);
    return o;
  };
  const give = b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'the-anomaly.jpg'; a.click(); };
  out(MW, MH).toBlob(give, "image/jpeg", 0.95);
};
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); load(e.dataTransfer.files[0]); });
addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])][0]; if (f) load(f); });

// move and zoom the image inside the anomaly
const pts = new Map(); let last = null;
const scale = () => MW / cv.clientWidth;
cv.addEventListener('pointerdown', e => { if (!img) return; cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); cv.className = 'grabbing'; last = null; });
cv.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId);
  pts.set(e.pointerId, [e.clientX, e.clientY]);
  if (pts.size === 1) { view.x += (e.clientX - prev[0]) * scale(); view.y += (e.clientY - prev[1]) * scale(); }
  else {
    const [a, b] = [...pts.values()];
    const dd = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (last) view.s = Math.max(0.3, Math.min(8, view.s * dd / last));
    last = dd;
  }
  draw();
});
const up = e => { pts.delete(e.pointerId); last = null; if (img && !pts.size) cv.className = 'grab'; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { if (!img) return; e.preventDefault(); view.s = Math.max(0.3, Math.min(8, view.s * Math.exp(-e.deltaY * 0.0015))); draw(); }, { passive: false });

addEventListener('resize', layout);
if (photo.complete && photo.naturalWidth) buildMask(); else photo.onload = buildMask;
</script>
</body>
</html>
