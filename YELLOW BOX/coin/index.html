<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--wall:#fff;--ink:#000;--line:#000}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;text-transform:uppercase;}
.wrap{max-width:1180px;margin:0 auto;padding:44px 34px 70px}

header{text-align:center;margin-bottom:10px}
h1{font-size:clamp(46px,9vw,104px);font-weight:700;letter-spacing:.30em;text-indent:.30em;line-height:1}
.hr{width:52px;height:1px;background:#000;margin:20px auto 0}

.stage{display:grid;grid-template-columns:1fr 330px;gap:30px;align-items:start;margin-top:26px}
@media (max-width:900px){.stage{grid-template-columns:1fr;gap:26px}}

/* ---------- the machine ---------- */
.diagram{max-width:600px;margin:0 auto;width:100%;position:relative;touch-action:none}
.diagram svg{width:100%;height:auto;display:block;overflow:visible;max-height:calc(100vh - 210px)}
.shake{animation:shk .34s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%{transform:translate(-2px,1px)}25%{transform:translate(3px,-2px)}
 40%{transform:translate(-3px,2px)}55%{transform:translate(2px,-1px)}
 70%{transform:translate(-1px,1px)}100%{transform:translate(0,0)}}

.solid{fill:#000;stroke:none}
.seam{stroke:#fff;stroke-width:2.4;fill:none}
.lead{stroke:#000;stroke-width:.8;fill:none}
.lab{fill:#000;font-size:10.5px;letter-spacing:.16em;font-family:inherit}
.tick{fill:#000}

#hammer{transform-box:fill-box;transform-origin:88% 62%;
  transition:transform .34s cubic-bezier(.22,.61,.36,1)}
#hammer.slam{transition:transform .07s cubic-bezier(.5,0,.9,.3)}
#punch{transition:transform .13s ease-out}
#coinG{transition:transform .16s ease-out}
#coinG.flip{transition:transform .28s ease-in}
#sparks line{stroke:#000;stroke-width:1.2;stroke-linecap:round;opacity:0}
#sparks.go line{animation:spk .38s ease-out}
@keyframes spk{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(1.25)}}
.grabbable{cursor:grab}.grabbing{cursor:grabbing}

/* ---------- controls ---------- */
.panel{border-left:1px solid #000;padding-left:24px}
@media (max-width:900px){.panel{border-left:0;padding-left:0;border-top:1px solid #000;padding-top:26px}}
.plabel{font-size:10px;letter-spacing:.2em;margin-bottom:10px}
input[type=text]{width:100%;background:transparent;border:0;border-bottom:1px solid #000;
  color:#000;font-family:inherit;font-size:19px;letter-spacing:.13em;text-transform:uppercase;
  padding:7px 0 9px;outline:none}
input[type=text]::placeholder{color:#000;opacity:.35}

.drop{display:block;margin-top:20px;border:1px dashed #000;padding:15px 12px;text-align:center;
  cursor:pointer;font-size:9.5px;letter-spacing:.18em;transition:background .2s}
.drop:hover,.drop.over{background:rgba(0,0,0,.06)}
.drop input{display:none}
.pctl{margin-top:12px;display:none}.pctl.on{display:block}
.prow{display:flex;align-items:center;gap:12px;font-size:9.5px;letter-spacing:.18em}
.prow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:3px;background:#000;
  outline:none;cursor:pointer}
.prow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:#000;cursor:pointer}
.prow input[type=range]::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;background:#000}
.prow button{background:none;border:0;color:#000;font-family:inherit;font-size:9.5px;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer}

.meter{margin-top:22px}
.mrow{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.18em;margin-bottom:6px}
.bar{height:7px;border:1px solid #000;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:#000;display:block}
#force i{transition:width .05s linear}
#relief i{transition:width .45s cubic-bezier(.2,.8,.2,1)}

.strike{margin-top:24px;width:100%;padding:19px 14px;background:transparent;border:1px solid #000;
  color:#000;font-family:inherit;font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;transition:.18s}
.strike:hover{background:rgba(0,0,0,.06)}
.strike.charging{background:rgba(0,0,0,.12)}
.strike[disabled]{cursor:default;background:#000;color:#fff}

.acts{margin-top:14px;display:flex;gap:8px}
.acts button{flex:1;padding:12px 6px;background:transparent;border:1px solid #000;color:#000;
  font-family:inherit;font-size:9px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.acts button:hover{background:rgba(0,0,0,.06)}

.caption{margin-top:46px;text-align:center;font-size:10.5px;letter-spacing:.17em;line-height:2.1}
.caption em{font-style:italic}

@media (max-width:900px){
  .wrap{padding:28px 20px 116px}
  .diagram svg{max-height:none}
  .strike{position:fixed;left:16px;right:16px;bottom:14px;width:auto;z-index:20;margin:0;
    background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .caption{margin-bottom:36px}
}
</style></head><body>

<div class="wrap">
<header>
  <h1>COIN</h1>
  <div class="hr"></div>
</header>

<div class="stage">

<div class="diagram" id="diagram">
<svg viewBox="0 -44 560 748" id="machine" role="img" aria-label="Hand-struck coin minting">

  <!-- HAMMER -->
  <g id="hammer">
    <path class="solid" d="M347 42 L497 -15 L503 2 L353 59 Z"/>
    <path class="solid" d="M252 20 L262 13 L360 13 L360 71 L350 78 L252 78 Z"/>
  </g>

  <g id="sparks" transform="translate(300,100)">
    <line x1="0" y1="0" x2="-30" y2="-16"/><line x1="0" y1="0" x2="30" y2="-16"/>
    <line x1="0" y1="0" x2="-40" y2="2"/><line x1="0" y1="0" x2="40" y2="2"/>
    <line x1="0" y1="0" x2="-22" y2="-30"/><line x1="0" y1="0" x2="22" y2="-30"/>
    <line x1="0" y1="0" x2="-8" y2="-36"/><line x1="0" y1="0" x2="8" y2="-36"/>
  </g>

  <!-- PUNCH, with the reverse die seated in its lower end -->
  <g id="punch">
    <path class="solid" d="M267 102 A33 9 0 0 1 333 102 L333 268 A33 9 0 0 1 267 268 Z"/>
    <path class="solid" d="M188 168 L268 175 L268 195 L188 188 Z"/>
    <path class="solid" d="M332 175 L412 168 L412 188 L332 195 Z"/>
    <path class="seam" d="M268 236 L332 236"/>
  </g>

  <!-- OBVERSE DIE -->
  <path class="solid" d="M208 464 A92 19 0 0 1 392 464 L392 512 A92 19 0 0 1 208 512 Z"/>

  <!-- ANVIL -->
  <path class="solid" d="M170 520 L430 520 L396 542 L396 638 L412 654 L188 654 L204 638 L204 542 Z"/>

  <!-- THE BLANK, struck where it sits -->
  <g id="coinG" transform="translate(300,372) scale(0.86)"></g>

  <!-- LABELS -->
  <g>
    <text class="lab" x="176" y="52" text-anchor="end">Hammer</text>
    <path class="lead" d="M184 48 L252 48"/><circle class="tick" cx="252" cy="48" r="1.9"/>
    <text class="lab" x="430" y="146" text-anchor="start">Punch</text>
    <path class="lead" d="M422 142 L333 142"/><circle class="tick" cx="333" cy="142" r="1.9"/>
    <text class="lab" x="430" y="256" text-anchor="start">Reverse die</text>
    <path class="lead" d="M422 252 L333 252"/><circle class="tick" cx="333" cy="252" r="1.9"/>
    <text class="lab" x="176" y="372" text-anchor="end">Coin blank</text>
    <path class="lead" d="M184 368 L213 370"/><circle class="tick" cx="213" cy="370" r="1.9"/>
    <text class="lab" x="430" y="482" text-anchor="start">Obverse die</text>
    <path class="lead" d="M422 478 L392 478"/><circle class="tick" cx="392" cy="478" r="1.9"/>
    <text class="lab" x="176" y="596" text-anchor="end">Anvil</text>
    <path class="lead" d="M184 592 L204 592"/><circle class="tick" cx="204" cy="592" r="1.9"/>
  </g>
</svg>
</div>

<div class="panel">
  <div class="plabel">Legend</div>
  <input type="text" id="name" maxlength="18" placeholder="Your name" autocomplete="off" spellcheck="false">

  <label class="drop" id="drop"><span id="droptxt">Add a picture</span>
    <input type="file" id="file" accept="image/*"></label>
  <div class="pctl" id="pctl"><div class="prow">
    <span>Zoom</span><input type="range" id="zoom" min="100" max="320" value="128">
    <button id="rmpic">Remove</button></div></div>

  <div class="meter"><div class="mrow"><span>Force</span><span id="ftxt">&mdash;</span></div>
    <div class="bar" id="force"><i></i></div></div>
  <div class="meter"><div class="mrow"><span>Relief</span><span id="rtxt">0%</span></div>
    <div class="bar" id="relief"><i></i></div></div>

  <button class="strike" id="strike">Hold to raise the hammer</button>
  <div class="acts">
    <button id="flip">Turn over</button>
    <button id="dl">Download</button>
    <button id="again">New blank</button>
  </div>
</div>
</div>

<div class="caption">Illustration showing coin minting</div>
</div>

/* ---- irregular hand-struck flan ---- */
function flan(h,R){
  let sd=h>>>0;const rnd=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296};
  const a1=rnd()*6.283,a2=rnd()*6.283,a3=rnd()*6.283,N=64,p=[];
  for(let i=0;i<N;i++){const t=i/N*6.283;
    const r=R*(1+.030*Math.sin(t*3+a1)+.017*Math.sin(t*5+a2)+.009*Math.sin(t*9+a3));
    p.push([Math.cos(t)*r,Math.sin(t)*r])}
  const mid=(u,v)=>[(u[0]+v[0])/2,(u[1]+v[1])/2];
  let m=mid(p[N-1],p[0]),d="M"+m[0].toFixed(2)+","+m[1].toFixed(2);
  for(let i=0;i<N;i++){const c=p[i],q=mid(c,p[(i+1)%N]);
    d+=" Q"+c[0].toFixed(2)+","+c[1].toFixed(2)+" "+q[0].toFixed(2)+","+q[1].toFixed(2)}
  return d+" Z"}

  while(root.firstChild)root.removeChild(root.firstChild);
  const h=hash((name||"blank").toUpperCase()+S), GM="#d9b455", GD="#7a5a1c", GH="#fdf3cd";
  const u=uid||"x";
  const defs=el("defs",{});
  const lg=el("radialGradient",{id:"g"+u,cx:"34%",cy:"27%",r:"82%"});
  [["0%","#f7e7b0"],["26%","#e6cb7d"],["58%","#cfa845"],["84%","#a67f2c"],["100%","#7d5c1d"]]
    .forEach(([o,c])=>lg.appendChild(el("stop",{offset:o,"stop-color":c})));
  defs.appendChild(lg);
  const emb=el("filter",{id:"e"+u,x:"-12%",y:"-12%",width:"124%",height:"124%"});
  emb.appendChild(el("feDropShadow",{dx:"1.2",dy:"1.5",stdDeviation:".6","flood-color":GD,"flood-opacity":"1"}));
  emb.appendChild(el("feDropShadow",{dx:"-.9",dy:"-1.1",stdDeviation:".5","flood-color":GH,"flood-opacity":".85"}));
  defs.appendChild(emb);
  /* Type needs its own treatment — the chained emboss haloes small glyphs
     and fills their counters. Incuse instead: dark cut, one catch-light. */
  const et=el("filter",{id:"et"+u,x:"-14%",y:"-14%",width:"128%",height:"128%"});
  et.appendChild(el("feDropShadow",{dx:"-.5",dy:"-.7",stdDeviation:".3",
    "flood-color":"#ffeeb6","flood-opacity":".95"}));
  defs.appendChild(et);
  const gr=el("filter",{id:"t"+u,x:"-2%",y:"-2%",width:"104%",height:"104%"});
  gr.appendChild(el("feTurbulence",{type:"fractalNoise",baseFrequency:".85",numOctaves:"3",
    seed:String(h%1000),result:"n"}));
  gr.appendChild(el("feColorMatrix",{type:"saturate",values:"0",in:"n",result:"gy"}));
  gr.appendChild(el("feComposite",{in:"gy",in2:"SourceAlpha",operator:"in"}));
  defs.appendChild(gr);
  defs.appendChild(el("path",{id:"tp"+u,d:"M -74,0 A 74 74 0 0 1 74,0",fill:"none"}));
  defs.appendChild(el("path",{id:"bp"+u,d:"M -74,0 A 74 74 0 0 0 74,0",fill:"none"}));
  const cp=el("clipPath",{id:"fc"+u});cp.appendChild(el("circle",{r:56}));defs.appendChild(cp);
  const vg=el("radialGradient",{id:"v"+u,cx:"50%",cy:"50%",r:"50%"});
  vg.appendChild(el("stop",{offset:"58%","stop-color":"#a67f2c","stop-opacity":"0"}));
  vg.appendChild(el("stop",{offset:"100%","stop-color":"#a67f2c","stop-opacity":".9"}));
  defs.appendChild(vg);
  root.appendChild(defs);

  const fd=flan(h,99);
  root.appendChild(el("path",{d:fd,fill:"url(#g"+u+")"}));
  root.appendChild(el("path",{d:fd,fill:"#8a6520","fill-opacity":".085",filter:"url(#t"+u+")"}));
  root.appendChild(el("path",{d:fd,fill:"none",stroke:"#6b4d14","stroke-opacity":".45","stroke-width":1.2}));

  const g=el("g",{"class":"design"});
  if(S==="o"&&portrait){
    const hold=el("g",{"clip-path":"url(#fc"+u+")"});
    const sz=116*(pzoom/100);
    hold.appendChild(el("image",{href:portrait,x:-sz/2+pox,y:-sz/2+poy,width:sz,height:sz,
      preserveAspectRatio:"xMidYMid slice","class":"pic"}));
    hold.appendChild(el("circle",{r:56,fill:"url(#v"+u+")"}));
    g.appendChild(hold);
  }
  const dev=el("g",{filter:"url(#e"+u+")",fill:"none",stroke:GM,"stroke-width":1.6});
  dev.appendChild(el("circle",{r:88,"stroke-width":1.8}));
  dev.appendChild(el("circle",{r:60,"stroke-width":1.2}));
  for(let i=0;i<64;i++){const a=i/64*6.283;
    dev.appendChild(el("circle",{cx:(Math.cos(a)*94).toFixed(2),cy:(Math.sin(a)*94).toFixed(2),
      r:1.5,fill:GM,stroke:"none"}))}
  const TXT="#120c01", ADV=.518, LS=2.2;
  /* GOTHICC averages .518em per cap — size the legend to fill its arc */
  const fit=(txt,maxS)=>{
    const avail=Math.PI*74*.90;
    return Math.max(11,Math.min(maxS,(avail/Math.max(1,txt.length)-LS)/ADV));
  };
  const arc=(pid,txt,maxS)=>{
    const size=fit(txt,maxS);
    const t=el("text",{fill:TXT,stroke:TXT,"stroke-width":(size*.062).toFixed(2),
      "stroke-linejoin":"round","font-size":size.toFixed(1),"letter-spacing":LS,
      "font-family":COINF,"font-weight":"400"});
    const tp=el("textPath",{startOffset:"50%","text-anchor":"middle"});
    tp.setAttribute("href","#"+pid+u); tp.textContent=txt; t.appendChild(tp); dev.appendChild(t)};
  arc("tp",(S==="o"?(name||"UNSTRUCK").toUpperCase():"VICTORIA").slice(0,16),29);
  arc("bp",S==="o"?YEAR:"CONOB",25);
  if(S==="o"){
    if(!portrait){
      const m=el("text",{x:0,y:23,fill:TXT,stroke:TXT,"stroke-width":"4.4","stroke-linejoin":"round",
        "font-size":78,"text-anchor":"middle","letter-spacing":2,
        "font-family":COINF,"font-weight":"400"});
      m.textContent=initials(name); dev.appendChild(m);
      dev.appendChild(el("path",{d:"M -28 40 L 28 40","stroke-width":1.6}));
    }
  }else{
    const steps=3+(h%2), sw=13+((h>>4)%5), cr=el("g",{});
    cr.appendChild(el("path",{d:"M 0 -46 L 0 6","stroke-width":4.2}));
    cr.appendChild(el("path",{d:"M -17 -30 L 17 -30","stroke-width":4.2}));
    cr.appendChild(el("path",{d:"M -22 -36 L -22 -24 M 22 -36 L 22 -24","stroke-width":3}));
    cr.appendChild(el("path",{d:"M -6 -52 L 6 -52","stroke-width":3}));
    for(let i=0;i<steps;i++){const w=sw+i*11,y=10+i*10;
      cr.appendChild(el("path",{d:"M "+(-w)+" "+y+" L "+w+" "+y,"stroke-width":6,"stroke-linecap":"butt"}))}
    dev.appendChild(cr);
  }
  g.appendChild(dev); root.appendChild(g);
}

/* ---------------- photo -> a face simple enough to strike ----------------
   A die cannot hold photographic detail. Auto-level, smooth the texture away,
   quantise to a handful of planes, round the steps, then light them — which is
   how an engraver reduces a likeness to something a punch can carry. */
function blurF(src,S,r){
  const N=S*S,t=new Float32Array(N),o=new Float32Array(N);
  for(let y=0;y<S;y++){let s=0;
    for(let k=-r;k<=r;k++)s+=src[y*S+Math.min(S-1,Math.max(0,k))];
    for(let X=0;X<S;X++){t[y*S+X]=s/(2*r+1);
      s+=src[y*S+Math.min(S-1,X+r+1)]-src[y*S+Math.max(0,X-r)]}}
  for(let X=0;X<S;X++){let s=0;
    for(let k=-r;k<=r;k++)s+=t[Math.min(S-1,Math.max(0,k))*S+X];
    for(let y=0;y<S;y++){o[y*S+X]=s/(2*r+1);
      s+=t[Math.min(S-1,y+r+1)*S+X]-t[Math.max(0,y-r)*S+X]}}
  return o}

function toRelief(img){
  const S=512,PLANES=5,SMOOTH=4,ROUND=5,LIGHT=4,TONE=.95;
  const c=document.createElement("canvas");c.width=c.height=S;
  const x=c.getContext("2d"),sc=Math.max(S/img.width,S/img.height);
  x.drawImage(img,(S-img.width*sc)/2,(S-img.height*sc)/2,img.width*sc,img.height*sc);
  const d=x.getImageData(0,0,S,S),px=d.data,N=S*S;
  let lum=new Float32Array(N);
  for(let i=0,j=0;j<N;i+=4,j++)lum[j]=(.299*px[i]+.587*px[i+1]+.114*px[i+2])/255;

  /* auto-level off the 2nd/98th percentile so any exposure engraves the same */
  const hist=new Array(256).fill(0);
  for(let j=0;j<N;j++)hist[Math.round(lum[j]*255)]++;
  let lo=0,hi=255,acc=0;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>N*.02){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>N*.02){hi=i;break}}
  const rng=Math.max(1,hi-lo);
  for(let j=0;j<N;j++)lum[j]=Math.min(1,Math.max(0,(lum[j]*255-lo)/rng));

  let m=blurF(lum,S,SMOOTH);                                   /* lose the texture */
  for(let j=0;j<N;j++)m[j]=Math.round(m[j]*(PLANES-1))/(PLANES-1);  /* few planes */
  m=blurF(m,S,ROUND);                                          /* round the steps */

  for(let y=0;y<S;y++)for(let X=0;X<S;X++){
    const j=y*S+X,xm=X>0?j-1:j,xp=X<S-1?j+1:j,ym=y>0?j-S:j,yp=y<S-1?j+S:j;
    const gx=m[xp]-m[xm],gy=m[yp]-m[ym];
    let v=.5+(-gx*.72-gy*.72)*LIGHT+(m[j]-.5)*TONE;
    v=v<0?0:v>1?1:v;
    v=Math.pow(v,.80);                     /* lift the mids off the floor */
    const i=j*4;px[i]=74+v*180;px[i+1]=56+v*176;px[i+2]=24+v*148;px[i+3]=255}
  x.putImageData(d,0,0);
  return c.toDataURL("image/jpeg",.92)}

function loadPic(f){
  if(!f||!/^image\//.test(f.type))return;
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();
    im.onload=()=>{portrait=toRelief(im);pox=poy=0;pzoom=+$("#zoom").value;
      $("#pctl").classList.add("on");$("#droptxt").textContent="Replace picture";
      face="o";relief=0;render()};
    im.src=fr.result};
  fr.readAsDataURL(f)}

/* ---------------- render ---------------- */
const coinG=$("#coinG"),nameEl=$("#name"),btn=$("#strike"),diagram=$("#diagram"),
      forceBar=$("#force").firstElementChild,reliefBar=$("#relief").firstElementChild,
      ftxt=$("#ftxt"),rtxt=$("#rtxt"),hammer=$("#hammer"),punch=$("#punch"),sparks=$("#sparks");
function render(){ buildCoin(coinG,nameEl.value,face,"m"); applyRelief(); }
function applyRelief(){
  const d=coinG.querySelector(".design");
  if(d){d.setAttribute("opacity",(.10+.90*relief).toFixed(3));
        d.setAttribute("transform","scale("+(.955+.045*relief).toFixed(3)+")")}
  reliefBar.style.width=(relief*100)+"%";
  rtxt.textContent=Math.round(relief*100)+"%";
  btn.textContent=relief>=1?"Fully struck":"Hold to raise the hammer";
  btn.disabled=relief>=1;
  coinG.parentNode.classList.toggle("grabbable",!!portrait);
}
function nudge(){
  const im=coinG.querySelector(".pic"); if(!im)return;
  const sz=116*(pzoom/100);
  im.setAttribute("x",-sz/2+pox);im.setAttribute("y",-sz/2+poy);
  im.setAttribute("width",sz);im.setAttribute("height",sz)}

/* ---------------- sound ---------------- */
let AC=null;
function clink(f){try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const t=AC.currentTime,g=AC.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.16*(.4+f),t+.005);
  g.gain.exponentialRampToValueAtTime(.0001,t+.55+f*.5);
  g.connect(AC.destination);
  [1850,2760,3910,5230].forEach((fr,i)=>{const o=AC.createOscillator();o.type="triangle";
    o.frequency.setValueAtTime(fr*(.96+f*.08),t);
    const gg=AC.createGain();gg.gain.value=[.5,.3,.16,.08][i];
    o.connect(gg);gg.connect(g);o.start(t);o.stop(t+1.2)});
  const o2=AC.createOscillator();o2.type="sine";
  o2.frequency.setValueAtTime(150,t);o2.frequency.exponentialRampToValueAtTime(48,t+.14);
  const g2=AC.createGain();g2.gain.setValueAtTime(.22*(.4+f),t);
  g2.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o2.connect(g2);g2.connect(AC.destination);o2.start(t);o2.stop(t+.25);
}catch(e){}}

/* ---------------- strike ---------------- */
function startCharge(e){
  if(busy||relief>=1)return;
  if(e&&e.cancelable)e.preventDefault();
  charging=true;t0=performance.now();btn.classList.add("charging");
  const loop=()=>{if(!charging)return;
    charge=Math.min((performance.now()-t0)/900,1);
    forceBar.style.width=(charge*100)+"%";ftxt.textContent=Math.round(charge*100)+"%";
    hammer.style.transform="translateY("+(-charge*74)+"px) rotate("+(-charge*11)+"deg)";
    raf=requestAnimationFrame(loop)};
  raf=requestAnimationFrame(loop)}
function release(){
  if(!charging)return;
  charging=false;cancelAnimationFrame(raf);btn.classList.remove("charging");
  const f=charge;charge=0;busy=true;
  hammer.classList.add("slam");
  hammer.style.transform="translateY(30px) rotate(1.5deg)";
  setTimeout(()=>impact(f),70*(1-f*.35)+30)}
function impact(f){
  clink(f);
  diagram.classList.remove("shake");void diagram.offsetWidth;diagram.classList.add("shake");
  /* the punch drives down onto the blank; the blank flattens under it */
  punch.style.transform="translateY(26px)";
  coinG.style.transform="translate(300px,372px) scale(0.86,0.79)";
  sparks.classList.remove("go");void sparks.offsetWidth;sparks.classList.add("go");
  relief=Math.min(1,relief+(.16+f*.46));
  applyRelief();
  setTimeout(()=>{
    hammer.classList.remove("slam");hammer.style.transform="translateY(0) rotate(0deg)";
    punch.style.transform="";coinG.style.transform="";
    forceBar.style.width="0";ftxt.textContent="—";busy=false},240)}

function cancelCharge(){
  if(!charging)return;
  charging=false;cancelAnimationFrame(raf);btn.classList.remove("charging");
  charge=0;forceBar.style.width="0";ftxt.textContent="—";
  hammer.style.transform="translateY(0) rotate(0deg)"}

/* One gesture, two meanings: hold still and it charges the hammer;
   move and it becomes a drag that reframes the picture on the blank. */
let onCoin=false,dragging=false,dsx=0,dsy=0,dox=0,doy=0;
diagram.addEventListener("pointerdown",e=>{
  onCoin=!!(portrait&&e.target.closest&&e.target.closest("#coinG"));
  dragging=false;dsx=e.clientX;dsy=e.clientY;dox=pox;doy=poy;
  if(onCoin){try{diagram.setPointerCapture(e.pointerId)}catch(_){}}
  startCharge(e)});
diagram.addEventListener("pointermove",e=>{
  if(!onCoin)return;
  const dx=e.clientX-dsx,dy=e.clientY-dsy;
  if(!dragging&&Math.hypot(dx,dy)>6){dragging=true;cancelCharge();diagram.classList.add("grabbing")}
  if(dragging){const k=200/diagram.getBoundingClientRect().width;
    pox=dox+dx*k;poy=doy+dy*k;nudge()}});
function endPointer(){
  if(dragging){dragging=false;onCoin=false;diagram.classList.remove("grabbing");return}
  onCoin=false;release()}

btn.addEventListener("pointerdown",e=>{onCoin=false;dragging=false;startCharge(e)});
addEventListener("pointerup",endPointer);addEventListener("pointercancel",endPointer);
addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat&&e.target.tagName!=="INPUT"){e.preventDefault();startCharge(e)}});
addEventListener("keyup",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();release()}});

/* ---------------- picture ---------------- */
$("#file").addEventListener("change",e=>loadPic(e.target.files[0]));
const drop=$("#drop");
["dragenter","dragover"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",e=>loadPic(e.dataTransfer.files[0]));
addEventListener("paste",e=>{const it=[...((e.clipboardData||{}).items||[])].find(i=>i.type.startsWith("image/"));
  if(it)loadPic(it.getAsFile())});
$("#zoom").addEventListener("input",e=>{pzoom=+e.target.value;nudge()});
$("#rmpic").addEventListener("click",e=>{e.preventDefault();portrait=null;pox=poy=0;
  $("#pctl").classList.remove("on");$("#droptxt").textContent="Add a picture";$("#file").value="";
  relief=0;render()});

/* ---------------- controls ---------------- */
nameEl.addEventListener("input",()=>{relief=0;render()});
$("#flip").onclick=()=>{
  coinG.classList.add("flip");
  coinG.style.transform="translate(300px,372px) scale(0.02,0.86)";
  setTimeout(()=>{face=face==="o"?"r":"o";render();
    coinG.style.transform="translate(300px,372px) scale(0.86)";
    setTimeout(()=>coinG.classList.remove("flip"),300)},290)};
$("#again").onclick=()=>{relief=0;face="o";render()};
$("#dl").onclick=()=>{
  const tmp=document.createElementNS(NS,"svg");
  tmp.setAttribute("xmlns",NS);tmp.setAttribute("viewBox","-110 -110 220 220");
  tmp.setAttribute("width",1200);tmp.setAttribute("height",1200);
  const stl=el("style",{}); stl.textContent=FONT_CSS; tmp.appendChild(stl);
  tmp.appendChild(el("rect",{x:-110,y:-110,width:220,height:220,fill:"#fff"}));
  const grp=el("g",{});tmp.appendChild(grp);
  buildCoin(grp,nameEl.value,face,"d");
  const dz=grp.querySelector(".design");
  if(dz){dz.setAttribute("opacity",(.10+.90*relief).toFixed(3));
         dz.setAttribute("transform","scale("+(.955+.045*relief).toFixed(3)+")")}
  const str=new XMLSerializer().serializeToString(tmp),img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=1200;
    c.getContext("2d").drawImage(img,0,0,1200,1200);
    c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);
      a.download="coin-"+((nameEl.value||"blank").toLowerCase().replace(/[^a-z0-9]+/g,"-"))+".png";
      a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},"image/png")};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str)};

const st=document.createElement("style"); st.textContent=FONT_CSS; document.head.appendChild(st);
if(window.FontFace){
  new FontFace("GOTHICC","url(data:font/woff2;base64,"+GOTHICC_B64+")").load()
    .then(f=>{document.fonts.add(f); render();}).catch(()=>render());
}else render();
render();
})();
</script></body></html>
